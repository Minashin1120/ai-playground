<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>更新履歴 - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111827; color: #f3f4f6; }
        .markdown-body h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; color: #60a5fa; border-bottom: 1px solid #374151; }
        .markdown-body p { margin-bottom: 0.5em; color: #9ca3af; font-size: 0.9rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; color: #d1d5db; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-white"><i class="fas fa-history text-orange-500 mr-3"></i> 更新履歴</h1>
            <a href="/" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-lg border border-gray-700 transition">戻る</a>
        </div>
        <div class="space-y-8">
            {% for log in logs %}
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="markdown-body" id="log-{{ loop.index }}"></div>
                <script>document.getElementById('log-{{ loop.index }}').innerHTML = DOMPurify.sanitize(marked.parse(`{{ log.content | replace('`', '\`') | safe }}`));</script>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
