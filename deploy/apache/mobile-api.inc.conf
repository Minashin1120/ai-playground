# Include inside the HTTPS VirtualHost only. Shared by the production vhost
# and the installation sample; this file contains no host-specific secrets.
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Preserve Flask's JSON status/error bodies for native clients.
<LocationMatch "^/(api/|android/connect$|chat_stream(_resume)?$|upload($|/)|files/)">
    ProxyErrorOverride Off
</LocationMatch>

# Pairing, credentials and streaming output must not enter shared caches.
<LocationMatch "^/(api/mobile/|android/connect$|chat_stream(_resume)?$)">
    Header always set Cache-Control "private, no-store, no-transform, max-age=0"
    Header always set Referrer-Policy "no-referrer"
    SetEnv no-gzip 1
</LocationMatch>
