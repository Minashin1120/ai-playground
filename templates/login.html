<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% include 'pwa_meta.html' %}
    <title>ログイン - AI Chat</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="google-signin-client_id" content="{{ google_client_id }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.tailwind.' ~ (system_version | lower) ~ '.css') }}?v={{ app_version }}">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleOneTap()"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js" integrity="sha384-lCSH9WfVk9FgPeso6qS/Xq9VRYIGdgxLyJ0z9qUfOxJJZV0ch+eyQWv2rGffJm/t" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/progress_spinner.js', v='4.8.268') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa_install.js') }}?v={{ app_version }}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-design.css') }}?v={{ app_version }}">
    <style>
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg-1);
            color: var(--text);
            position: relative;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.03) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.03) 98%);
            background-size: 48px 48px;
            pointer-events: none;
            opacity: 0.35;
            z-index: -2;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(var(--theme-rgb),0.4); }
            70% { box-shadow: 0 0 0 12px rgba(var(--theme-rgb),0); }
            100% { box-shadow: 0 0 0 0 rgba(var(--theme-rgb),0); }
        }
        .btn-loading { animation: pulse-glow 1.5s infinite; pointer-events: none; opacity: 0.8; }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981) !important;
            box-shadow: 0 14px 30px rgba(16,185,129,0.35);
        }
        .btn-success-icon {
            width: 22px; height: 22px; vertical-align: middle;
            animation: check-pop 0.28s cubic-bezier(0.2, 0.9, 0.25, 1.2) both;
        }
        .btn-success-icon path {
            stroke: #041014; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
            fill: none; stroke-dasharray: 24; stroke-dashoffset: 24;
            animation: check-draw 0.32s ease-out forwards 0.08s;
        }
        @keyframes check-pop {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes check-draw {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-error { animation: slide-down 0.3s ease-out; }
        .success-overlay {
            position: fixed; inset: 0; background: var(--bg-1); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
        }
        .success-overlay.active { opacity: 1; pointer-events: auto; }
        @keyframes checkmark {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .checkmark-svg {
            width: 80px; height: 80px; stroke: var(--accent);
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
            fill: none; stroke-dasharray: 48; stroke-dashoffset: 48;
        }
        .active .checkmark-svg { animation: checkmark 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.2s; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center">
    <!-- Animated aurora gradient background -->
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-blob blob-teal1"></div>
        <div class="aurora-blob blob-amber1"></div>
        <div class="aurora-blob blob-cyan1"></div>
        <div class="aurora-blob blob-violet1"></div>
    </div>

    <div id="g_id_onload"
         data-client_id="{{ google_client_id }}"
         data-callback="handleGoogleCredentialResponse"
         data-auto_prompt="true"
         data-context="signin"
         data-use_fedcm_for_prompt="true">
    </div>

    <div id="success-screen" class="success-overlay">
        <div class="text-center">
            <svg class="checkmark-svg mx-auto mb-4" viewBox="0 0 24 24">
                <path d="M20 6L9 17L4 12"></path>
            </svg>
            <h2 class="text-2xl font-bold auth-title">認証成功</h2>
            <p class="text-slate-400 mt-2">ダッシュボードへ移動しています...</p>
        </div>
    </div>

    <div id="auth-container" class="auth-card p-8 rounded-2xl w-full max-w-sm transition-all duration-500">
        <h1 class="text-3xl mb-8 font-bold text-center auth-title">AI Chat Login</h1>
        
        <div id="login-error" class="hidden bg-rose-500/15 text-rose-200 p-3 rounded-lg mb-4 text-sm text-center border border-rose-400/40"></div>
        
        <div id="login-section">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">ユーザー名</label>
                    <input type="text" name="username" required class="w-full p-3 rounded-xl text-white outline-none input-field">
                </div>
                <div>
                    <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">パスワード</label>
                    <input type="password" id="login-password" name="password" required class="w-full p-3 rounded-xl text-white outline-none input-field">
                </div>
                <div class="flex flex-wrap items-center gap-4">
                    <div class="flex items-center">
                        <input type="checkbox" id="show-password-toggle" class="w-4 h-4 bg-gray-700 border-gray-600 rounded">
                        <label for="show-password-toggle" class="ml-2 text-sm text-slate-300">パスワードを表示</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" name="remember" id="remember" class="w-4 h-4 bg-gray-700 border-gray-600 rounded">
                        <label for="remember" class="ml-2 text-sm text-slate-300">ログイン状態を保持</label>
                    </div>
                </div>
                {% if site_key %}
                <div class="flex justify-center"><div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark"
                     data-callback="onTurnstileSuccess"
                     data-expired-callback="onTurnstileExpired"
                     data-error-callback="onTurnstileError"></div></div>
                {% endif %}
                <button type="submit" class="w-full font-bold py-3 rounded-xl transition primary-btn">ログイン</button>
            </form>

            <div class="mt-4">
                <a href="{{ url_for('login_google') }}" class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-bold py-2.5 rounded-xl transition hover:bg-gray-100 border border-gray-200">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-3.3 3.28-8.19 3.28-13.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.16H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.84l3.66-2.75z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.16l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                    </svg>
                    Googleでログイン
                </a>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-700/60">
                <h2 class="text-sm font-bold text-slate-200 mb-3 text-center">パスキーでログイン</h2>
                <div id="passkey-error" class="hidden bg-rose-500/15 text-rose-200 p-2 rounded mb-3 text-xs text-center border border-rose-400/40"></div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">ユーザー名</label>
                        <input type="text" id="passkey-username" class="w-full p-3 rounded-xl text-white outline-none input-field">
                    </div>
                    <button id="passkey-login-btn" type="button" class="w-full font-bold py-2.5 rounded-xl transition secondary-btn">パスキーでログイン</button>
                    <div class="text-[11px] text-slate-400 text-center">パスキー登録済みのアカウントで利用できます。</div>
                </div>
            </div>
        </div>

        <div id="totp-section" class="hidden space-y-6">
            <div class="text-center">
                <h2 class="text-xl font-bold text-white mb-2">2段階認証</h2>
                <p class="text-xs text-slate-400">認証コードを入力してください</p>
            </div>
            
            <div class="flex border-b border-slate-700 mb-4">
                <button onclick="switch2FATab('totp')" id="tab-totp" class="flex-1 py-2 text-sm font-semibold border-b-2 border-teal-400 text-teal-400">App Code</button>
                <button onclick="switch2FATab('webauthn')" id="tab-webauthn" class="flex-1 py-2 text-sm text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer">Security Key</button>
            </div>

            <form id="totp-form" class="space-y-5">
                <div>
                    <label class="block text-slate-300 text-[11px] font-semibold mb-2 text-center uppercase tracking-[0.1em]">認証コード (6桁)</label>
                    <input type="text" id="totp-input" name="totp_code" class="w-full bg-[#0b121a] text-white border border-slate-700 rounded-xl py-3 px-3 focus:outline-none focus:border-teal-400 font-mono text-center text-2xl tracking-[0.3em]" placeholder="000000" maxlength="6" autocomplete="one-time-code">
                </div>
                <button type="submit" class="w-full font-bold py-3 rounded-xl transition primary-btn">
                    認証する
                </button>
            </form>

            <div id="webauthn-form" class="hidden text-center py-4">
                <div class="mb-4 text-slate-300">
                    <i class="fas fa-fingerprint text-4xl mb-2 text-amber-300"></i>
                    <p class="text-sm">セキュリティキーまたはTouch IDを使用</p>
                </div>
                <button onclick="startWebAuthn()" class="w-full font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 secondary-btn">
                    認証を開始
                </button>
            </div>

            <button onclick="backToLogin()" class="w-full text-sm text-slate-400 hover:text-slate-200 transition">ログイン画面に戻る</button>
        </div>

        <div class="mt-6 pt-6 border-t border-slate-700/60 text-center" id="signup-link-section">
            <p class="text-sm text-slate-400 mb-3">アカウントをお持ちでない方</p>
            <a href="/signup" class="inline-block w-full text-white font-bold py-2 rounded-xl transition text-sm ghost-btn">新規アカウント作成</a>
        </div>
    </div>

    <footer class="mt-8 text-center text-xs text-slate-500 space-y-2">
        <div class="flex justify-center gap-4">
            <button onclick="showLegal('terms')" class="hover:text-white transition">利用規約</button>
            <button onclick="showLegal('privacy')" class="hover:text-white transition">プライバシーポリシー</button>
        </div>
        <p>&copy; 2026 AI Chat Playground</p>
    </footer>

    <!-- Legal Modal -->
    <div id="legal-modal" class="fixed inset-0 bg-gray-900/95 z-[80] hidden items-center justify-center backdrop-blur-sm modal-overlay">
        <div class="bg-slate-900 rounded-2xl w-full max-w-3xl p-6 shadow-2xl border border-slate-700 m-4 flex flex-col max-h-[85vh] modal-panel text-left">
            <h2 id="legal-title" class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">利用規約</h2>
            <div id="legal-content" class="overflow-y-auto pr-2 flex-1 text-sm text-slate-300 leading-relaxed space-y-4 prose max-w-none"></div>
            <div class="flex justify-end mt-4 shrink-0">
                <button onclick="hideLegal()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl border border-slate-700 transition">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const showModal = (id) => {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.style.display = 'flex';
            void el.offsetHeight;
            el.classList.add('modal-open');
        };
        const hideModal = (id) => {
            const el = document.getElementById(id);
            el.classList.remove('modal-open');
            setTimeout(() => {
                el.style.display = 'none';
                el.classList.add('hidden');
            }, 300);
        };

        window.showLegal = async (t) => {
            const title = t === 'terms' ? '利用規約' : 'プライバシーポリシー';
            document.getElementById('legal-title').innerText = title;
            showModal('legal-modal');
            const res = await fetch("/static/legal/" + t + ".md?t=" + Date.now());
            if(!res.ok) return;
            const text = await res.text();
            document.getElementById('legal-content').innerHTML = DOMPurify.sanitize(marked.parse(text));
        };
        window.hideLegal = () => hideModal('legal-modal');

        // Close on overlay click
        document.getElementById('legal-modal').onclick = (e) => {
            if (e.target.id === 'legal-modal') hideLegal();
        };

        const showLoginError = (msg) => {
            const box = document.getElementById('login-error');
            const container = document.getElementById('auth-container');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
            box.classList.add('animate-error');
            
            // Shake the container
            container.classList.remove('animate-shake');
            void container.offsetWidth; // trigger reflow
            container.classList.add('animate-shake');
        };

        const clearLoginError = () => {
            const box = document.getElementById('login-error');
            if (box) {
                box.classList.add('hidden');
                box.classList.remove('animate-error');
            }
            const container = document.getElementById('auth-container');
            if (container) container.classList.remove('animate-shake');
        };

        const resetLoginSubmitButton = () => {
            const btn = document.querySelector('#login-form button[type="submit"]');
            if (!btn) return;
            const defaultText = btn.dataset.defaultText || 'ログイン';
            btn.classList.remove('btn-loading');
            btn.classList.remove('btn-success');
            btn.disabled = false;
            btn.innerText = defaultText;
        };

        const showLoginButtonSuccess = async (btn) => {
            if (!btn) return;
            btn.classList.remove('btn-loading');
            btn.classList.add('btn-success');
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="btn-success-icon mx-auto" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 6L9 17L4 12"></path>
                </svg>
            `;
            await new Promise((resolve) => setTimeout(resolve, 520));
        };

        const triggerSuccess = (redirectUrl) => {
            const container = document.getElementById('auth-container');
            const successScreen = document.getElementById('success-screen');
            
            container.style.transform = 'scale(0.95)';
            container.style.opacity = '0';
            
            setTimeout(() => {
                successScreen.classList.add('active');
                setTimeout(() => {
                    window.location.href = redirectUrl || '/';
                }, 1200);
            }, 300);
        };

        window.backToLogin = () => {
            resetLoginSubmitButton();
            document.getElementById('auth-container').classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                document.getElementById('totp-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('signup-link-section').classList.remove('hidden');
                document.getElementById('auth-container').classList.remove('opacity-0', 'scale-95');
            }, 300);
        };

        window.switch2FATab = (t) => {
            const isTotp = t === 'totp';
            document.getElementById('totp-form').classList.toggle('hidden', !isTotp);
            document.getElementById('webauthn-form').classList.toggle('hidden', isTotp);
            
            const tabTotp = document.getElementById('tab-totp');
            const tabWebauthn = document.getElementById('tab-webauthn');
            
            if (isTotp) {
                tabTotp.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-teal-400 text-teal-400";
                tabWebauthn.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer";
            } else {
                tabTotp.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer";
                tabWebauthn.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-teal-400 text-teal-400";
            }
        };

        const init2FAUI = (method) => {
            const m = method === 'webauthn' ? 'webauthn' : 'totp';
            switch2FATab(m);
            document.getElementById('auth-container').classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('signup-link-section').classList.add('hidden');
                document.getElementById('totp-section').classList.remove('hidden');
                document.getElementById('auth-container').classList.remove('opacity-0', 'scale-95');
                if (m === 'totp') {
                    document.getElementById('totp-input').focus();
                } else {
                    startWebAuthn();
                }
            }, 300);
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            clearLoginError();

            // Turnstile must be completed before we even attempt credential validation
            const turnstileToken = getTurnstileToken();
            if (!turnstileToken) {
                showLoginError("認証を完了してください");
                resetLoginSubmitButton();
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            if (!btn.dataset.defaultText) btn.dataset.defaultText = btn.innerText;
            btn.classList.remove('btn-success');
            btn.disabled = true;
            btn.classList.add('btn-loading');
            btn.innerText = "認証中...";

            try {
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                data['cf-turnstile-response'] = getTurnstileToken();
                const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrf,
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                let result = {};
                try {
                    const contentType = res.headers.get('content-type') || '';
                    if (contentType.includes('application/json')) {
                        result = await res.json();
                    } else {
                        // Fallback: try to parse text as JSON, otherwise use status-based message
                        const text = await res.text();
                        try { result = JSON.parse(text); } catch (_) { result = {}; }
                    }
                } catch (parseErr) {
                    result = {};
                }

                if (res.ok) {
                    if (result.status === 'ok') {
                        await showLoginButtonSuccess(btn);
                        triggerSuccess(result.redirect);
                    } else if (result.status === '2fa_required') {
                        resetLoginSubmitButton();
                        init2FAUI(result.default_method);
                    }
                } else {
                    // Prefer server-provided error, otherwise give a clear Japanese message based on status
                    let msg = result.error || result.message;
                    if (!msg) {
                        if (res.status === 401 || res.status === 403) {
                            msg = "ユーザー名またはパスワードが正しくありません";
                        } else if (res.status >= 500) {
                            msg = "サーバーエラーが発生しました。時間をおいて再度お試しください";
                        } else {
                            msg = "ログインに失敗しました";
                        }
                    }
                    showLoginError(msg);
                    if (window.turnstile) window.turnstile.reset();
                    resetLoginSubmitButton();
                }
            } catch (err) {
                // True network / fetch failure
                console.error('Login fetch error:', err);
                showLoginError("ネットワークエラーが発生しました");
                resetLoginSubmitButton();
            }
        };

        document.getElementById('totp-form').onsubmit = async (e) => {
            e.preventDefault();
            clearLoginError();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.classList.add('btn-loading');
            btn.innerText = "認証中...";

            try {
                const code = document.getElementById('totp-input').value;
                const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
                
                const res = await fetch("{{ url_for('verify_2fa') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrf,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ totp_code: code })
                });

                let result = {};
                try {
                    const ct = res.headers.get('content-type') || '';
                    if (ct.includes('application/json')) {
                        result = await res.json();
                    } else {
                        const t = await res.text();
                        try { result = JSON.parse(t); } catch (_) {}
                    }
                } catch (_) {}
                if (res.ok && result.status === 'ok') {
                    triggerSuccess(result.redirect);
                } else {
                    let msg = result.error || result.message;
                    if (!msg) {
                        msg = (res.status === 401 || res.status === 403) ? "認証に失敗しました" : "認証に失敗しました";
                    }
                    showLoginError(msg);
                    btn.classList.remove('btn-loading');
                    btn.disabled = false;
                    btn.innerText = "認証する";
                }
            } catch (err) {
                showLoginError("ネットワークエラーが発生しました");
                btn.classList.remove('btn-loading');
                btn.disabled = false;
                btn.innerText = "認証する";
            }
        };

        async function startWebAuthn() {
            const btn = document.querySelector('#webauthn-form button');
            const originalText = btn.innerHTML;
            try {
                clearLoginError();
                btn.disabled = true;
                btn.classList.add('btn-loading');
                btn.innerText = "認証中...";

                const csrf = document.querySelector('meta[name="csrf-token"]').content;
                const optsRes = await fetch('/verify-2fa/webauthn/options', {
                    method: 'POST',
                    headers: {'X-CSRF-Token': csrf}
                });
                if(!optsRes.ok) {
                    const errData = await optsRes.json();
                    throw new Error(errData.error || "Failed to get options");
                }
                const options = await optsRes.json();
                const { get: getCredential } = await import('https://esm.sh/@github/webauthn-json@2.1.1');
                const credential = await getCredential({ publicKey: options });
                const verifyRes = await fetch('/verify-2fa/webauthn/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrf
                    },
                    body: JSON.stringify(credential)
                });
                const result = await verifyRes.json();
                if(result.status === 'ok') {
                    triggerSuccess("/");
                } else {
                    showLoginError("認証に失敗しました: " + (result.error || "Unknown error"));
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    btn.innerHTML = originalText;
                }
            } catch(e) {
                console.error(e);
                showLoginError("認証エラー: " + e.message);
                btn.disabled = false;
                btn.classList.remove('btn-loading');
                btn.innerHTML = originalText;
            }
        }

        // Turnstile state tracking (prevents credential check until CAPTCHA is solved)
        let turnstileSolved = false;

        window.onTurnstileSuccess = function () {
            turnstileSolved = true;
        };
        window.onTurnstileExpired = function () {
            turnstileSolved = false;
        };
        window.onTurnstileError = function () {
            turnstileSolved = false;
        };

        const getTurnstileToken = () => {
            const el = document.querySelector('[name="cf-turnstile-response"]');
            return el ? el.value : '';
        };
        const showPasskeyError = (msg) => {
            const box = document.getElementById('passkey-error');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
        };
        const clearPasskeyError = () => {
            const box = document.getElementById('passkey-error');
            if (box) box.classList.add('hidden');
        };
        document.getElementById('passkey-login-btn').onclick = async (e) => {
            const btn = e.currentTarget;
            const originalText = btn.innerHTML;
            clearPasskeyError();
            const usernameInput = document.querySelector('input[name="username"]');
            const username = (document.getElementById('passkey-username').value || (usernameInput ? usernameInput.value : '') || '').trim();
            if (!username) { showPasskeyError('ユーザー名を入力してください'); return; }
            const token = getTurnstileToken();
            if (!token) {
                showPasskeyError('認証を完了してください');
                return;
            }
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
            
            try {
                btn.disabled = true;
                btn.classList.add('btn-loading');
                btn.innerText = "認証中...";

                const optsRes = await fetch('/login/passkey/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify({ username, remember: document.getElementById('remember')?.checked || false, turnstile: token })
                });
                const options = await optsRes.json();
                if (!optsRes.ok) { 
                    showPasskeyError(options.error || 'パスキーの準備に失敗しました');
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    btn.innerHTML = originalText;
                    return; 
                }
                const { get: getCredential } = await import('https://esm.sh/@github/webauthn-json@2.1.1');
                const credential = await getCredential({ publicKey: options });
                const verifyRes = await fetch('/login/passkey/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify(credential)
                });
                const verifyData = await verifyRes.json();
                if (verifyRes.ok) { 
                    triggerSuccess("/");
                } else { 
                    showPasskeyError(verifyData.error || 'ログインに失敗しました');
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    btn.innerHTML = originalText;
                }
            } catch (e) {
                console.error(e);
                showPasskeyError('パスキー認証に失敗しました');
                btn.disabled = false;
                btn.classList.remove('btn-loading');
                btn.innerHTML = originalText;
            }
        };

        const passwordInput = document.getElementById('login-password');
        const showPasswordToggle = document.getElementById('show-password-toggle');
        if (passwordInput && showPasswordToggle) {
            showPasswordToggle.addEventListener('change', () => {
                passwordInput.type = showPasswordToggle.checked ? 'text' : 'password';
            });
        }

        // Google One Tap
        function handleGoogleCredentialResponse(response) {
            clearLoginError();
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
            const formData = new URLSearchParams();
            formData.append('credential', response.credential);

            fetch('/login/google/one-tap', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRF-Token': csrf
                },
                body: formData.toString()
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.error || "Login failed"); });
                }
                return res.json();
            })
            .then(data => {
                if (data.status === 'ok') {
                    triggerSuccess(data.redirect);
                } else if (data.status === '2fa_required') {
                    init2FAUI(data.default_method);
                } else {
                    showLoginError(data.error || "Google ログインに失敗しました");
                }
            })
            .catch(err => {
                console.error("Google One Tap Error:", err);
                showLoginError(err.message || "Google 連携中にネットワークエラーが発生しました");
            });
        }

        window.initGoogleOneTap = function () {
            if (window.google && window.google.accounts && window.google.accounts.id) {
                // HTML要素(g_id_onload)がある場合は自動的に初期化されますが、
                // 明示的にprompt()を呼ぶことで表示を確実化します。
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed()) {
                        console.warn("One Tap not displayed:", notification.getNotDisplayedReason());
                    }
                });
            }
        };
    </script>
</body>
</html>
