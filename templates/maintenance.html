<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サービス一時停止中 - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="text-orange-500 text-6xl animate-pulse">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="text-3xl font-bold text-white">サービス一時停止中</h1>
        
        <div class="bg-gray-800 border border-orange-500/30 p-6 rounded-xl shadow-2xl">
            <p class="text-gray-300 mb-4">
                現在、システムに重大な問題が発生しているため、緊急メンテナンスを実施しております。
            </p>
            <p class="text-sm text-gray-500">
                管理者による復旧作業中です。ご迷惑をおかけしますが、再開まで今しばらくお待ちください。
            </p>
        </div>

        <div class="flex justify-center gap-4">
            <a href="/logout" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition border border-gray-600">
                ログアウト
            </a>
            <a href="/" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm transition font-bold">
                トップページへ
            </a>
        </div>
        
        <p class="text-xs text-gray-600 mt-8">System ID: 503-EMERGENCY-LOCKDOWN</p>
    </div>
</body>
</html>
