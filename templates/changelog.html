<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% include 'pwa_meta.html' %}
    <title>更新履歴 - AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.tailwind.' ~ (system_version | lower) ~ '.css') }}?v={{ app_version }}">
    <script src="{{ url_for('static', filename='vendor/marked-4.3.0.min.js') }}?v={{ app_version }}" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb"></script>
    <script src="{{ url_for('static', filename='vendor/dompurify-3.4.11.min.js') }}?v={{ app_version }}" integrity="sha384-o44XUELLEnv/iSlA1NWxBweqbD4TSR0qgq2VzVsxtkHS989JJjGKSE9vkfo5MN4K"></script>
    <script src="{{ url_for('static', filename='js/pwa_install.js') }}?v={{ app_version }}" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-design.css') }}?v={{ app_version }}">
    <style>
        body {
            background: var(--bg-1);
            color: var(--text);
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            position: relative;
            font-size: 16px;
            line-height: 1.7;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.03) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.03) 98%);
            background-size: 48px 48px;
            pointer-events: none;
            opacity: 0.35;
            z-index: -1;
        }
        .markdown-body { font-size: 1rem; line-height: 1.75; }
        .markdown-body h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 0.7em; color: var(--theme-300); border-bottom: 1px solid rgba(148,163,184,0.2); }
        .markdown-body p { margin-bottom: 0.8em; color: var(--muted); font-size: 1rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.4em; margin-bottom: 1em; color: #d1d5db; font-size: 1rem; }
        .markdown-body li { margin-bottom: 0.35em; }
        @media (min-width: 768px) {
            body { font-size: 15px; }
            .markdown-body { font-size: 0.98rem; }
            .markdown-body h1 { font-size: 1.6em; }
            .markdown-body p { font-size: 0.95rem; }
            .markdown-body ul { font-size: 0.95rem; }
        }
        .log-card {
            background: rgba(10, 16, 35, 0.84);
            border: 1px solid rgba(148,163,184,0.14);
            box-shadow: 0 22px 50px rgba(0,0,0,0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
        }
        .log-card-enter {
            animation: cardFadeIn 0.35s ease-out both;
        }
        .log-card-leave {
            animation: cardFadeOut 0.25s ease-in both;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-12px); }
        }
        .search-box {
            background: rgba(10, 16, 35, 0.7);
            border: 1px solid rgba(148,163,184,0.14);
            color: #e2e8f0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            outline: none;
        }
        .search-box::placeholder { color: #64748b; }
        .search-clear-btn {
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s;
        }
        .search-clear-btn:hover { color: #e2e8f0; }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-white"><i class="fas fa-history text-amber-300 mr-3"></i> 更新履歴</h1>
            <a href="/" class="px-4 py-2 bg-slate-900/70 hover:bg-slate-800 text-white rounded-lg border border-slate-700 transition">戻る</a>
        </div>
        <div class="relative mb-8">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" id="search-input" class="search-box w-full pl-11 pr-10 py-3 rounded-xl text-sm" placeholder="更新履歴を検索..." autocomplete="off">
                <i id="search-clear" class="fas fa-times search-clear-btn absolute right-4 top-1/2 -translate-y-1/2 text-sm hidden"></i>
            </div>
            <div id="search-status" class="text-gray-500 text-xs mt-2 hidden"></div>
        </div>

        <div id="changelog-container" class="space-y-8">
            {% for log in logs %}
            <div class="log-card p-6 rounded-xl log-card-enter" style="animation-delay: {{ loop.index0 * 0.05 }}s">
                {% if log.title %}
                <div class="text-teal-300 font-semibold text-sm mb-2">{{ log.title }}</div>
                {% endif %}
                <div class="markdown-body">{{ log.content }}</div>
            </div>
            {% endfor %}
        </div>

        <div id="loading-trigger" class="py-10 flex justify-center items-center">
            <div id="spinner" class="loading-spinner hidden"></div>
            <div id="no-more" class="text-gray-500 text-sm hidden">これ以上の履歴はありません</div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const limit = {{ limit }};
        const totalItems = {{ total }};
        let isLoading = false;
        let hasMore = totalItems > limit;
        let searchMode = false;
        let searchDebounce = null;

        const container = document.getElementById('changelog-container');
        const trigger = document.getElementById('loading-trigger');
        const spinner = document.getElementById('spinner');
        const noMore = document.getElementById('no-more');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const searchStatus = document.getElementById('search-status');

        function renderMarkdown(el) {
            if (el.dataset.rendered !== 'true') {
                el.innerHTML = DOMPurify.sanitize(marked.parse(el.textContent));
                el.dataset.rendered = 'true';
            }
        }

        function createCard(log, delay = 0) {
            const card = document.createElement('div');
            card.className = 'log-card p-6 rounded-xl log-card-enter';
            if (delay) card.style.animationDelay = delay + 's';
            let html = '';
            if (log.title) {
                html += `<div class="text-teal-300 font-semibold text-sm mb-2">${log.title}</div>`;
            }
            const markdownHtml = DOMPurify.sanitize(marked.parse(log.content));
            html += `<div class="markdown-body">${markdownHtml}</div>`;
            card.innerHTML = html;
            return card;
        }

        function animateReplaceCards(newLogs) {
            const existing = container.querySelectorAll('.log-card');

            if (existing.length === 0) {
                newLogs.forEach((log, i) => {
                    const card = createCard(log, i * 0.05);
                    container.appendChild(card);
                });
                return;
            }

            existing.forEach((el, i) => {
                el.style.animationDelay = (i * 0.03) + 's';
                el.classList.remove('log-card-enter');
                el.classList.add('log-card-leave');
            });

            const lastLeave = existing[existing.length - 1];
            const animDuration = 250 + (existing.length - 1) * 30;

            setTimeout(() => {
                container.innerHTML = '';
                newLogs.forEach((log, i) => {
                    const card = createCard(log, i * 0.05);
                    container.appendChild(card);
                });
            }, animDuration);
        }

        // Initial markdown rendering
        document.querySelectorAll('.markdown-body').forEach(renderMarkdown);

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            spinner.classList.remove('hidden');
            currentPage++;

            try {
                const response = await fetch(`/api/changelogs?page=${currentPage}&limit=${limit}`);
                const data = await response.json();
                
                if (data.logs.length === 0) {
                    hasMore = false;
                    noMore.classList.remove('hidden');
                } else {
                    data.logs.forEach((log, i) => {
                        const card = createCard(log, i * 0.05);
                        container.appendChild(card);
                    });

                    if (currentPage * limit >= data.total) {
                        hasMore = false;
                        noMore.classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error('Error loading changelogs:', error);
            } finally {
                isLoading = false;
                spinner.classList.add('hidden');
            }
        }

        async function doSearch(query) {
            isLoading = true;
            spinner.classList.remove('hidden');
            trigger.classList.remove('hidden');
            noMore.classList.add('hidden');

            try {
                const response = await fetch(`/api/changelogs/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                animateReplaceCards(data.logs);

                if (data.total > 0) {
                    searchStatus.textContent = `${data.total} 件の更新履歴が見つかりました`;
                    searchStatus.classList.remove('hidden');
                } else {
                    searchStatus.textContent = '該当する更新履歴はありません';
                    searchStatus.classList.remove('hidden');
                }

                if (data.total <= limit) {
                    hasMore = false;
                }

                trigger.classList.add('hidden');
            } catch (error) {
                console.error('Search error:', error);
            } finally {
                isLoading = false;
                spinner.classList.add('hidden');
            }
        }

        function resetToInitialView() {
            searchMode = false;
            searchStatus.classList.add('hidden');
            hasMore = totalItems > limit;
            currentPage = 1;
            isLoading = false;

            // Fetch first page fresh
            trigger.classList.remove('hidden');
            fetch(`/api/changelogs?page=1&limit=${limit}`).then(r => r.json()).then(data => {
                animateReplaceCards(data.logs);
                if (data.total > limit) {
                    hasMore = true;
                    if (!observerInited) initObserver();
                } else {
                    hasMore = false;
                    noMore.classList.remove('hidden');
                }
            }).catch(() => {});
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            const q = searchInput.value.trim();

            if (q.length > 0) {
                searchClear.classList.remove('hidden');
                searchDebounce = setTimeout(() => {
                    searchMode = true;
                    doSearch(q);
                }, 300);
            } else {
                searchClear.classList.add('hidden');
                searchStatus.classList.add('hidden');
                clearTimeout(searchDebounce);
                if (searchMode) {
                    resetToInitialView();
                }
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.add('hidden');
            searchStatus.classList.add('hidden');
            clearTimeout(searchDebounce);
            if (searchMode) {
                resetToInitialView();
            }
        });

        let observerInited = false;

        function initObserver() {
            if (observerInited) return;
            observerInited = true;

            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !searchMode) {
                    loadMore();
                }
            }, { threshold: 0.1 });

            observer.observe(trigger);
        }

        if (hasMore) {
            initObserver();
        } else if (totalItems > 0) {
            noMore.classList.remove('hidden');
        }
    </script>
</body>
</html>
