<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'pwa_meta.html' %}
    <title>新規登録 - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="{{ url_for('static', filename='js/progress_spinner.js', v='4.8.268') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa_install.js') }}?v={{ app_version }}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #060b18;
            --bg-2: #0a1128;
            --panel: #0d1530;
            --line: #1a2540;
            --text: #e8eaef;
            --muted: #8e9aaf;
            --accent: #0dd4bf;
            --accent-2: #f59e0b;
            --danger: #f9708d;
        }
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #060b18;
            color: var(--text);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.03) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.03) 98%);
            background-size: 48px 48px;
            pointer-events: none;
            opacity: 0.4;
            z-index: -1;
        }

        /* Animated Aurora / Mesh Gradient Background (login + auth pages) */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(38px);
            will-change: transform;
            opacity: 0.45;
            mix-blend-mode: screen;
        }
        .blob-teal1 {
            width: 780px; height: 780px;
            background: radial-gradient(circle at 40% 45%, rgba(13,212,191,0.85), transparent 60%);
            top: -10%; left: -8%;
            animation: aurora-drift-1 18s ease-in-out infinite;
        }
        .blob-amber1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle at 55% 35%, rgba(245,158,11,0.75), transparent 64%);
            top: 22%; right: -10%;
            animation: aurora-drift-2 14s ease-in-out infinite;
            animation-delay: -6s;
        }
        .blob-cyan1 {
            width: 620px; height: 620px;
            background: radial-gradient(circle at 30% 60%, rgba(103,232,249,0.6), transparent 66%);
            bottom: -6%; left: 12%;
            animation: aurora-drift-3 20s ease-in-out infinite;
            animation-delay: -11s;
        }
        .blob-violet1 {
            width: 660px; height: 660px;
            background: radial-gradient(circle at 65% 55%, rgba(139,92,246,0.5), transparent 68%);
            top: 8%; right: -2%;
            animation: aurora-drift-1 16s ease-in-out infinite;
            animation-delay: -3s;
            opacity: 0.38;
        }

        @keyframes aurora-drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            22% { transform: translate(7%, -5%) scale(1.035); }
            48% { transform: translate(-5%, 8%) scale(0.965); }
            73% { transform: translate(9%, 3%) scale(1.025); }
        }
        @keyframes aurora-drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            18% { transform: translate(-6%, 7%) scale(0.97); }
            45% { transform: translate(8%, -4%) scale(1.04); }
            68% { transform: translate(-3%, -8%) scale(0.98); }
        }
        @keyframes aurora-drift-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(5%, 6%) scale(1.03); }
            52% { transform: translate(-8%, -3%) scale(0.96); }
            78% { transform: translate(4%, 9%) scale(1.02); }
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora-blob { animation: none !important; opacity: 0.26; filter: blur(26px); }
        }
        @media (max-width: 640px) {
            .aurora-blob { filter: blur(28px); opacity: 0.44; }
            .blob-teal1, .blob-amber1, .blob-cyan1, .blob-violet1 { width: 560px; height: 560px; }
        }

        .auth-card {
            background: rgba(10, 16, 35, 0.82);
            border: 1px solid rgba(148,163,184,0.15);
            box-shadow: 0 26px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
        }
        .auth-title {
            background: linear-gradient(135deg, #5eedd9, #fbbf24);
            -webkit-background-clip: text;
            color: transparent;
        }
        .input-field {
            background: rgba(8, 14, 28, 0.7);
            border: 1px solid var(--line);
        }
        .input-field:focus {
            border-color: rgba(13,212,191,0.7);
            box-shadow: 0 0 0 3px rgba(13,212,191,0.2);
        }
        .primary-btn {
            background: linear-gradient(135deg, #0dd4bf, #08b2a5);
            color: #031413;
            box-shadow: 0 14px 30px rgba(13,212,191,0.25);
        }
        .ghost-link {
            color: #94a3b8;
        }
        .ghost-link:hover {
            color: #e2e8f0;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Animated aurora gradient background -->
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-blob blob-teal1"></div>
        <div class="aurora-blob blob-amber1"></div>
        <div class="aurora-blob blob-cyan1"></div>
        <div class="aurora-blob blob-violet1"></div>
    </div>

    <div class="auth-card p-8 rounded-2xl w-full max-w-sm">
        <h1 class="text-2xl mb-6 font-bold text-center auth-title">アカウント作成</h1>
        {% if error %}
        <div class="bg-rose-500/15 text-rose-200 p-3 rounded-lg mb-4 text-sm text-center border border-rose-400/40">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">希望ユーザー名</label>
                <input type="text" name="username" required class="w-full p-3 rounded-xl text-white outline-none input-field">
            </div>
            <div>
                <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">パスワード</label>
                <input type="password" name="password" required class="w-full p-3 rounded-xl text-white outline-none input-field">
            </div>
            {% if site_key %}
            <div class="flex justify-center"><div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark"></div></div>
            {% endif %}
            <button type="submit" class="w-full font-bold py-3 rounded-xl transition primary-btn">次へ進む</button>
        </form>
        <div class="mt-4">
            <a href="{{ url_for('login_google') }}" class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-bold py-2.5 rounded-xl transition hover:bg-gray-100 border border-gray-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-3.3 3.28-8.19 3.28-13.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.16H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.84l3.66-2.75z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.16l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                </svg>
                Googleで登録
            </a>
        </div>
        <div class="mt-4 text-center">
            <a href="/login" class="text-sm ghost-link">ログイン画面に戻る</a>
        </div>
    </div>
</body>
</html>
