<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <title>オフライン | AI Chat Playground</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #05070f;
      --bg-2: #080c18;
      --text: #eef1f7;
      --muted: #8b95a8;
      --theme-rgb: 13, 212, 191;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(700px 360px at 50% 0%, rgba(var(--theme-rgb), 0.12), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(226, 232, 240, 0.04) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.35;
      pointer-events: none;
    }
    .panel {
      position: relative;
      width: min(92vw, 540px);
      background: rgba(10, 16, 35, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }
    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 999px;
      color: #fef3c7;
      border: 1px solid rgba(245, 158, 11, 0.5);
      background: rgba(120, 53, 15, 0.4);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.35;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="panel" role="main" aria-live="polite">
    <div class="badge">オフライン</div>
    <h1>ネットワークに接続されていません</h1>
    <p>接続が復旧すると通常画面へ戻れます。以前に開いたページは、ブラウザの再読み込みで表示できる場合があります。</p>
  </main>
</body>
</html>
