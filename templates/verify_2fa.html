<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% include 'pwa_meta.html' %}
    <title>2FA Verification - AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.tailwind.' ~ (system_version | lower) ~ '.css') }}?v={{ app_version }}">
    <script src="{{ url_for('static', filename='js/progress_spinner.js', v='4.8.640') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa_install.js') }}?v={{ app_version }}" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-design.css') }}?v={{ app_version }}">
    <style>
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg-1);
            color: var(--text);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.03) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.03) 98%);
            background-size: 48px 48px;
            pointer-events: none;
            opacity: 0.35;
            z-index: -2;
        }
        .tab-active {
            color: var(--theme-300);
            border-bottom-color: rgba(var(--theme-rgb), 0.8);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <!-- Animated aurora gradient background -->
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-blob blob-teal1"></div>
        <div class="aurora-blob blob-amber1"></div>
        <div class="aurora-blob blob-cyan1"></div>
        <div class="aurora-blob blob-violet1"></div>
    </div>

    <div class="auth-card p-8 rounded-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">2段階認証</h2>
        
        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <div class="mb-6">
            <div class="flex border-b border-slate-700 mb-4">
                {% if has_totp %}
                <button onclick="switchTab('totp')" id="tab-totp" class="flex-1 py-2 text-sm {% if default_method == 'totp' %}tab-active font-semibold cursor-default border-b-2{% else %}text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer{% endif %}">App Code</button>
                {% endif %}
                {% if has_webauthn %}
                <button onclick="switchTab('webauthn')" id="tab-webauthn" class="flex-1 py-2 text-sm {% if default_method == 'webauthn' %}tab-active font-semibold cursor-default border-b-2{% else %}text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer{% endif %}">Security Key</button>
                {% endif %}
            </div>

            <!-- TOTP Form -->
            <form id="form-totp" class="{% if default_method != 'totp' %}hidden{% endif %}">
                <div id="totp-error" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded mb-4 text-sm"></div>
                <div class="mb-4">
                    <label class="block text-slate-300 text-sm font-semibold mb-2">認証コード (6桁)</label>
                    <input type="text" id="totp-input" name="totp_code" class="w-full bg-[#0b121a] text-white border border-slate-700 rounded-xl py-2.5 px-3 focus:outline-none focus:border-teal-400 font-mono text-center text-xl tracking-widest" placeholder="000000" maxlength="6" {% if default_method == 'totp' %}autofocus{% endif %} required autocomplete="one-time-code">
                </div>
                <button type="submit" class="w-full font-bold py-2.5 px-4 rounded-xl transition primary-btn">
                    認証する
                </button>
            </form>

            <!-- WebAuthn -->
            <div id="form-webauthn" class="{% if default_method != 'webauthn' %}hidden{% endif %} text-center py-4">
                <div class="mb-4 text-slate-300">
                    <i class="fas fa-key text-4xl mb-2 text-amber-300"></i>
                    <p>セキュリティキーまたはTouch IDを使用</p>
                </div>
                <button onclick="startWebAuthn()" class="w-full font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 secondary-btn">
                    <i class="fas fa-fingerprint"></i> 認証を開始
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <form method="POST" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="text-sm text-slate-400 hover:text-slate-200">ログイン画面に戻る</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(t) {
            const totpForm = document.getElementById('form-totp');
            const webauthnForm = document.getElementById('form-webauthn');
            const totpTab = document.getElementById('tab-totp');
            const webauthnTab = document.getElementById('tab-webauthn');

            if (totpForm) totpForm.classList.add('hidden');
            if (webauthnForm) webauthnForm.classList.add('hidden');
            const targetForm = document.getElementById('form-'+t);
            if (targetForm) targetForm.classList.remove('hidden');
            
            if (totpTab) totpTab.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white cursor-pointer border-b-2 border-transparent";
            if (webauthnTab) webauthnTab.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white cursor-pointer border-b-2 border-transparent";

            const targetTab = document.getElementById('tab-'+t);
            if (targetTab) targetTab.className = "flex-1 py-2 text-sm font-semibold tab-active border-b-2 cursor-default";
        }

        document.getElementById('form-totp').onsubmit = async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('totp-error');
            const btn = e.target.querySelector('button[type="submit"]');
            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "認証中...";

            try {
                const code = document.getElementById('totp-input').value;
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                
                const res = await fetch("{{ url_for('verify_2fa') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ totp_code: code })
                });

                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    window.location.href = data.redirect || "{{ url_for('index') }}";
                } else {
                    errEl.innerText = data.error || "認証に失敗しました";
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = "認証する";
                }
            } catch (err) {
                console.error(err);
                errEl.innerText = "ネットワークエラーが発生しました";
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "認証する";
            }
        };

        async function startWebAuthn() {
            const btn = document.querySelector('#form-webauthn button');
            const originalText = btn.innerHTML;
            try {
                btn.disabled = true;
                btn.innerText = "認証中...";

                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                
                // 1. Get Options
                const optsRes = await fetch('/verify-2fa/webauthn/options', {
                    method: 'POST',
                    headers: {'X-CSRF-Token': csrfToken}
                });
                if(!optsRes.ok) {
                    const errData = await optsRes.json();
                    throw new Error(errData.error || "Failed to get options");
                }
                const options = await optsRes.json();
                
                // 2. Browser Verification
                const { get: getCredential } = await import('https://esm.sh/@github/webauthn-json@2.1.1');
                const credential = await getCredential({ publicKey: options });
                
                // 3. Verify on Server
                const verifyRes = await fetch('/verify-2fa/webauthn/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify(credential)
                });
                
                const result = await verifyRes.json();
                if(result.status === 'ok') {
                    window.location.href = "{{ url_for('index') }}";
                } else {
                    alert("Verification failed: " + (result.error || "Unknown error"));
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch(e) {
                console.error(e);
                alert("Auth Error: " + e.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
