
                <div id="prompt-controls-row" class="composer-controls flex flex-wrap items-center text-xs text-gray-400 gap-1.5">
                    <div id="prompt-primary-controls" class="flex items-center gap-1.5 min-w-0 flex-wrap">
                        <input type="hidden" id="model-select" value="gemini-3.6-flash">
                        <button id="model-selector-btn" onclick="openModelModal()" class="bg-gray-700 border border-gray-600 rounded-full px-2.5 py-1 text-white text-xs hover:bg-gray-600 transition flex items-center gap-1.5 max-w-[180px] truncate">
                            <i class="fas fa-robot text-blue-400"></i>
                            <span id="model-selector-text">Gemini 3.6 Flash</span>
                            <i class="fas fa-chevron-down text-[10px] text-gray-400 ml-auto"></i>
                        </button>
                        <label id="canvas-mode-container" class="composer-chip flex items-center gap-1 cursor-pointer select-none px-2 py-0.5 rounded-full border border-cyan-500/30 bg-cyan-900/15 text-cyan-200" title="コードブロックを右側のCanvasでプレビューします">
                            <input type="checkbox" id="enable-canvas-mode" class="accent-cyan-400 w-3 h-3">
                            <span>Canvas</span>
                        </label>
                        <label id="coding-mode-container" class="composer-chip flex items-center gap-1 cursor-pointer select-none px-2 py-0.5 rounded-full border border-emerald-500/30 bg-emerald-900/15 text-emerald-200" title="既存コードの変更行だけをモデルに生成させ、完成コードへ安全に反映します">
                            <input type="checkbox" id="enable-coding-mode" class="accent-emerald-400 w-3 h-3">
                            <span>Coding</span>
                        </label>
                        <label id="browser-fast-mode-container" class="composer-chip flex items-center gap-1 cursor-pointer select-none px-2 py-0.5 rounded-full border border-amber-500/40 bg-amber-900/20 text-amber-200" title="新規Geminiチャットをブラウザから直接送信します">
                            <input type="checkbox" id="enable-browser-fast-mode" class="accent-amber-400 w-3 h-3">
                            <span>高速</span>
                        </label>
                        <button id="prompt-controls-toggle-btn" type="button" aria-expanded="false" class="hidden bg-gray-700 border border-gray-600 rounded-full px-2 py-0.5 text-[10px] text-gray-200 hover:bg-gray-600 transition items-center gap-1 btn-hover" title="詳細設定を表示/非表示">
                            <span id="prompt-controls-toggle-text">詳細</span>
                            <i id="prompt-controls-toggle-icon" class="fas fa-chevron-down text-[10px]"></i>
                        </button>
                    </div>
                    <div id="prompt-details-controls">
                        <div class="prompt-details-inner flex items-center gap-1 flex-wrap min-w-0">
                        <div id="standard-chat-controls" class="composer-detail-chips flex gap-1 items-center flex-wrap">
                        <label id="search-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none"><input type="checkbox" id="enable-search" class="accent-blue-500 w-3 h-3"><span>Search</span></label>
                        <label id="url-context-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none hidden"><input type="checkbox" id="enable-url-context" class="accent-indigo-500 w-3 h-3"><span>URLs</span></label>
                        <label id="maps-grounding-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none hidden" title="Gemini 3系で利用可能"><input type="checkbox" id="enable-maps" class="accent-emerald-500 w-3 h-3"><span>Maps</span></label>
                        <label id="python-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none"><input type="checkbox" id="enable-python" class="accent-yellow-500 w-3 h-3" checked><span class="text-yellow-200">Python</span></label>
                        <label id="file-creation-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none"><input type="checkbox" id="enable-file-creation" class="accent-orange-500 w-3 h-3" checked><span class="text-orange-300">File</span></label>
                        <label id="mcp-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none hidden" title="MCP（外部ツール接続）。このチャットで接続中のMCPツール（Gmail/Drive等）を使用します。オフにするとツールの付与と案内文の注入を無効にします。"><input type="checkbox" id="enable-mcp" class="accent-cyan-500 w-3 h-3" checked><span class="text-cyan-200">MCP</span></label>
                        <div id="sys-prompt-option" class="composer-opt flex items-center gap-0.5 select-none">
                            <label class="flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" id="enable-sys-prompt" class="accent-green-500 w-3 h-3">
                                <span class="text-green-300">SysPrompt</span>
                            </label>
                            <button type="button" onclick="openThreadModal()" class="text-gray-500 hover:text-green-400 transition p-1" title="Chat Settings">
                                <i class="fas fa-cog text-[10px]"></i>
                            </button>
                        </div>
                        <div id="thinking-options" class="composer-opt composer-opt-group flex items-center gap-1.5 hidden">
                            <label class="flex items-center gap-1 cursor-pointer select-none">
                                <input type="checkbox" id="enable-thinking" class="accent-purple-500 w-3 h-3">
                                <span class="text-purple-300">Thinking</span>
                            </label>
                            <select id="thinking-level" class="bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-xs text-white outline-none">
                                <option value="minimal">Min</option>
                                <option value="low">Low</option>
                                <option value="medium">Mid</option>
                                <option value="high" selected>High</option>
                            </select>
                            <label class="text-[10px] text-purple-300/80">Budget</label>
                            <input id="thinking-budget" type="number" min="0" max="32768" step="256" value="4096" class="w-20 bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-[10px] text-white outline-none" title="Gemini 2.5のみ有効（tokens）">
                        </div>
                        <div id="reasoning-effort-container" class="composer-opt composer-opt-group hidden flex items-center gap-1"><span class="text-gray-400">Effort:</span><select id="reasoning-effort" class="bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-xs text-white outline-none"><option value="none">None</option><option value="low">Low</option><option value="medium" selected>Med</option><option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option></select></div>
                        <div id="safety-option" class="composer-opt composer-opt-group flex items-center gap-1"><span class="text-gray-400">Safety:</span><select id="safety-setting" class="bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-xs text-white outline-none"><option value="default">Default</option><option value="none" class="text-red-300">None</option></select></div>
                        <div id="prompt-cache-container" class="composer-opt flex items-center gap-0.5 select-none">
                            <label class="flex items-center gap-1 cursor-pointer" title="プロンプトキャッシュを有効化（同一APIプロバイダ内のモデルのみ切替可）">
                                <input type="checkbox" id="enable-prompt-cache" class="accent-teal-500 w-3 h-3">
                                <span class="text-teal-300 text-[10px]">PromptCache</span>
                            </label>
                        </div>
                        <div id="compression-option" class="composer-opt flex items-center gap-0.5 select-none">
                            <label class="flex items-center gap-1 cursor-pointer" title="Client-side Compression">
                                <input type="checkbox" id="enable-compression" class="accent-blue-500 w-3 h-3" checked>
                                <span class="text-gray-400 text-[10px]">Compress</span>
                            </label>
                            <button type="button" onclick="openCompressionModal()" class="text-gray-500 hover:text-blue-400 transition p-1" title="Compression Settings">
                                <i class="fas fa-cog text-[10px]"></i>
                            </button>
                        </div>
                        </div>
                        <div id="temporary-chat-controls" class="flex items-center gap-1">
                            <label id="temporary-chat-container" class="composer-opt flex items-center gap-1 cursor-pointer select-none" title="切断後にこのチャットとアップロード添付を自動削除"><input type="checkbox" id="enable-temporary-chat" class="accent-amber-500 w-3 h-3"><span class="text-amber-300 text-[10px]">一時チャット</span></label>
                            <button type="button" onclick="openTemporaryChatSettings()" class="text-[10px] text-amber-300 hover:text-amber-200 border border-amber-500/40 rounded px-1.5 py-0.5 transition btn-hover" title="一時チャット設定を開く">
                                設定
                            </button>
                        </div>
                        </div>
                    </div>
                </div>
