<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% include 'pwa_meta.html' %}
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.tailwind.' ~ (system_version | lower) ~ '.css') }}?v={{ app_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-design.css') }}?v={{ app_version }}">
    <script src="{{ url_for('static', filename='js/pwa_install.min.js') }}?v={{ app_version }}" defer></script>
    {% include 'web_fonts.html' %}
    <style>
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(800px 520px at 20% -10%, rgba(13,212,191,0.16), transparent 55%),
                        radial-gradient(700px 520px at 85% 0%, rgba(245,158,11,0.12), transparent 60%),
                        linear-gradient(180deg, #05070f, #080c18);
            color: var(--text, #e8eaef);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(226, 232, 240, 0.04) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
            opacity: 0.35;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <div class="max-w-2xl w-full text-center">
        <div class="text-sm uppercase tracking-[0.35em] text-slate-400">Page not found</div>
        <div class="mt-3 text-7xl md:text-8xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-300 to-amber-300">404</div>
        <h1 class="mt-5 text-2xl md:text-3xl font-bold text-white">お探しのページが見つかりません</h1>
        <p class="mt-3 text-slate-300 leading-relaxed">
            {{ message or "URL が間違っているか、ページが削除された可能性があります。" }}
        </p>
        <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
            {% if current_user.is_authenticated %}
            <a href="/" id="back-to-chat" class="px-6 py-3 rounded-xl bg-teal-400 hover:bg-teal-300 text-slate-900 font-bold shadow-lg shadow-teal-500/30 transition">チャットへ戻る</a>
            {% else %}
            <a href="/login" class="px-6 py-3 rounded-xl bg-teal-400 hover:bg-teal-300 text-slate-900 font-bold shadow-lg shadow-teal-500/30 transition">ログインへ</a>
            {% endif %}
            <a href="/" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 transition">トップページへ</a>
        </div>
    </div>
<script>
    (function() {
        const link = document.getElementById('back-to-chat');
        if (!link) return;
        const ref = document.referrer || '';
        try {
            if (ref && ref.startsWith(location.origin) && ref.includes('/c/')) {
                link.href = ref;
            }
        } catch (e) {}
    })();
</script>
</body>
</html>
