name: Android CI
on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/gradle/**'
      - 'android/build.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradlew'
      - 'android/settings.gradle.kts'
      - 'android/version.properties'
      - 'android/ci/bootstrap-keystore.sh'
      - 'android/ci/verify-apk.sh'
      - 'android/ci/verify-keystore.sh'
      - 'android/ci/debug.keystore'
      - 'android/ci/signing-fingerprint.txt'
  pull_request:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/gradle/**'
      - 'android/build.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradlew'
      - 'android/settings.gradle.kts'
      - 'android/version.properties'
      - 'android/ci/bootstrap-keystore.sh'
      - 'android/ci/verify-apk.sh'
      - 'android/ci/verify-keystore.sh'
      - 'android/ci/debug.keystore'
      - 'android/ci/signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-fixed-signing-key
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.key.outputs.sha }}
      skip_unit_tests: ${{ steps.skip.outputs.unit_tests }}
      skip_lint: ${{ steps.skip.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Persist or reuse the fixed keystore
        id: key
        run: bash android/ci/bootstrap-keystore.sh
      # scripts/record_changes.sh and publish_version.sh add these trailers on request; manual runs check everything.
      - name: Read requested check skips
        id: skip
        if: github.event_name == 'push'
        run: |
          message=$(git log -1 --format=%B "$GITHUB_SHA")
          unit_tests=false
          lint=false
          if grep -qx 'Android-Skip-Unit-Tests: true' <<< "$message"; then unit_tests=true; fi
          if grep -qx 'Android-Skip-Lint: true' <<< "$message"; then lint=true; fi
          echo "unit_tests=$unit_tests" >> "$GITHUB_OUTPUT"
          echo "lint=$lint" >> "$GITHUB_OUTPUT"
          if [[ "$unit_tests" == true || "$lint" == true ]]; then
            echo "::notice title=Android checks skipped::unit tests skipped=$unit_tests, lint skipped=$lint"
          fi

  build:
    needs: bootstrap
    if: always() && (github.event_name == 'pull_request' || needs.bootstrap.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bootstrap.outputs.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact build source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle.kts'
      - name: Check wrapper and fixed signing certificate
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          bash android/ci/verify-keystore.sh
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Select HTML preview device checks
        id: preview_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || git diff --name-only HEAD^ HEAD | grep -E '^(android/app/src/(main/(java/com/minashin1120/aiplayground/ui/(HtmlCodePreviewDialog|MarkdownText|PlaygroundDialog|PlaygroundMotion|PlaygroundTheme)\.kt|assets/html-preview-security\.js)|androidTest/.*)|android/app/build\.gradle\.kts|android/ci/test-html-preview-device\.sh)$' > /dev/null; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: HTML preview on Android 35
        if: steps.preview_scope.outputs.enabled == 'true'
        working-directory: android
        run: HTML_PREVIEW_API=35 bash ci/test-html-preview-device.sh
      - name: HTML preview on Android 37
        if: steps.preview_scope.outputs.enabled == 'true'
        working-directory: android
        run: HTML_PREVIEW_API=37.0 bash ci/test-html-preview-device.sh
      - name: HTML preview device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: html-preview-device
          path: |
            ${{ runner.temp }}/html-preview-device/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Unit tests, lint and debug APK
        working-directory: android
        env:
          SKIP_UNIT_TESTS: ${{ needs.bootstrap.outputs.skip_unit_tests == 'true' && 'true' || 'false' }}
          SKIP_LINT: ${{ needs.bootstrap.outputs.skip_lint == 'true' && 'true' || 'false' }}
        run: |
          set +e
          tasks="assembleDebug"
          if [[ "$SKIP_LINT" != "true" ]]; then
            tasks="lintDebug $tasks"
          fi
          if [[ "$SKIP_UNIT_TESTS" != "true" ]]; then
            tasks="testDebugUnitTest -Proborazzi.test.record=true $tasks"
          fi
          ./gradlew --no-daemon $tasks --stacktrace > "$RUNNER_TEMP/android-build.log" 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            tail -n 120 "$RUNNER_TEMP/android-build.log"
            {
              echo '### Android build failure tail'
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/android-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            compiler_errors=$(grep -E '^e: ' "$RUNNER_TEMP/android-build.log" | head -n 40 || true)
            if [[ -n "$compiler_errors" ]]; then
              detail=$(printf '%s\n' "$compiler_errors" | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')
            else
              failure_context=$(grep -E -B 3 -A 20 '(^FAILURE:|^\* What went wrong:|^> Task .* FAILED|Execution failed for task|There were failing tests|Lint found|:[0-9]+: Error:)' "$RUNNER_TEMP/android-build.log" | tail -n 120 || true)
              if [[ -z "$failure_context" ]]; then
                failure_context=$(tail -n 120 "$RUNNER_TEMP/android-build.log")
              fi
              detail=$(printf '%s\n' "$failure_context" | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')
            fi
            echo "::error title=Android build failure::$detail"
            exit "$status"
          fi
          tail -n 40 "$RUNNER_TEMP/android-build.log"
      - name: Verify APK signature
        run: bash android/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/ci/signing-fingerprint.txt
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          # Roborazzi screenshots of the Web-parity UI are compared with the Web chat at the same width.
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

  # The release APK builds alongside the debug build; it is published only after both succeed.
  release:
    needs: bootstrap
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.bootstrap.outputs.sha }}
      skip_unit_tests: true
      skip_lint: ${{ needs.bootstrap.outputs.skip_lint == 'true' }}
      stage: build

  publish:
    needs: [build, release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.build.outputs.sha }}
      stage: publish

  # Published APKs live on the GitHub Release, so artifacts from earlier runs only consume Actions storage.
  prune-artifacts:
    needs: [publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.id != $RUN_ID) | .id")
          count=0
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            count=$((count + 1))
          done
          echo "Deleted $count artifacts from earlier runs."
