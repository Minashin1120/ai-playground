<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% include 'pwa_meta.html' %}
    <title>2FA Verification - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/progress_spinner.js', v='4.8.268') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa_install.js') }}?v={{ app_version }}" defer></script>
    <script type="module">
        import { create, get } from 'https://esm.sh/@github/webauthn-json@2.1.1';
        window.webauthnJSON = { create, get };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0f14;
            --bg-2: #0f1720;
            --panel: #0c141e;
            --line: #1c2636;
            --text: #e5e7eb;
            --muted: #9aa3b2;
            --accent: #14b8a6;
            --accent-2: #f59e0b;
            --danger: #fb7185;
        }
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(820px 520px at 20% -10%, rgba(20,184,166,0.2), transparent 55%),
                        radial-gradient(700px 520px at 85% 0%, rgba(245,158,11,0.18), transparent 60%),
                        linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.05) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.05) 98%);
            background-size: 38px 38px;
            pointer-events: none;
            opacity: 0.35;
        }

        /* Animated Aurora / Mesh Gradient Background (login + auth pages) */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(32px);
            will-change: transform;
            opacity: 0.52;
            mix-blend-mode: screen;
        }
        .blob-teal1 {
            width: 780px; height: 780px;
            background: radial-gradient(circle at 40% 45%, rgba(20,184,166,0.92), transparent 60%);
            top: -10%; left: -8%;
            animation: aurora-drift-1 18s ease-in-out infinite;
        }
        .blob-amber1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle at 55% 35%, rgba(245,158,11,0.82), transparent 64%);
            top: 22%; right: -10%;
            animation: aurora-drift-2 14s ease-in-out infinite;
            animation-delay: -6s;
        }
        .blob-cyan1 {
            width: 620px; height: 620px;
            background: radial-gradient(circle at 30% 60%, rgba(103,232,249,0.68), transparent 66%);
            bottom: -6%; left: 12%;
            animation: aurora-drift-3 20s ease-in-out infinite;
            animation-delay: -11s;
        }
        .blob-violet1 {
            width: 660px; height: 660px;
            background: radial-gradient(circle at 65% 55%, rgba(167,139,250,0.58), transparent 68%);
            top: 8%; right: -2%;
            animation: aurora-drift-1 16s ease-in-out infinite;
            animation-delay: -3s;
            opacity: 0.42;
        }

        @keyframes aurora-drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            22% { transform: translate(7%, -5%) scale(1.035); }
            48% { transform: translate(-5%, 8%) scale(0.965); }
            73% { transform: translate(9%, 3%) scale(1.025); }
        }
        @keyframes aurora-drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            18% { transform: translate(-6%, 7%) scale(0.97); }
            45% { transform: translate(8%, -4%) scale(1.04); }
            68% { transform: translate(-3%, -8%) scale(0.98); }
        }
        @keyframes aurora-drift-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(5%, 6%) scale(1.03); }
            52% { transform: translate(-8%, -3%) scale(0.96); }
            78% { transform: translate(4%, 9%) scale(1.02); }
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora-blob { animation: none !important; opacity: 0.26; filter: blur(26px); }
        }
        @media (max-width: 640px) {
            .aurora-blob { filter: blur(28px); opacity: 0.44; }
            .blob-teal1, .blob-amber1, .blob-cyan1, .blob-violet1 { width: 560px; height: 560px; }
        }

        .auth-card {
            background: rgba(11,18,26,0.92);
            border: 1px solid rgba(148,163,184,0.2);
            box-shadow: 0 26px 60px rgba(0,0,0,0.45);
            backdrop-filter: blur(14px);
        }
        .tab-active {
            color: #5eead4;
            border-bottom-color: rgba(20,184,166,0.8);
        }
        .primary-btn {
            background: linear-gradient(135deg, #14b8a6, #0ea5a4);
            color: #041014;
            box-shadow: 0 14px 30px rgba(20,184,166,0.3);
        }
        .secondary-btn {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #1f1303;
            box-shadow: 0 12px 28px rgba(245,158,11,0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <!-- Animated aurora gradient background -->
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora-blob blob-teal1"></div>
        <div class="aurora-blob blob-amber1"></div>
        <div class="aurora-blob blob-cyan1"></div>
        <div class="aurora-blob blob-violet1"></div>
    </div>

    <div class="auth-card p-8 rounded-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">2段階認証</h2>
        
        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <div class="mb-6">
            <div class="flex border-b border-slate-700 mb-4">
                {% if has_totp %}
                <button onclick="switchTab('totp')" id="tab-totp" class="flex-1 py-2 text-sm {% if default_method == 'totp' %}tab-active font-semibold cursor-default border-b-2{% else %}text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer{% endif %}">App Code</button>
                {% endif %}
                {% if has_webauthn %}
                <button onclick="switchTab('webauthn')" id="tab-webauthn" class="flex-1 py-2 text-sm {% if default_method == 'webauthn' %}tab-active font-semibold cursor-default border-b-2{% else %}text-slate-400 hover:text-white border-b-2 border-transparent cursor-pointer{% endif %}">Security Key</button>
                {% endif %}
            </div>

            <!-- TOTP Form -->
            <form id="form-totp" class="{% if default_method != 'totp' %}hidden{% endif %}">
                <div id="totp-error" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded mb-4 text-sm"></div>
                <div class="mb-4">
                    <label class="block text-slate-300 text-sm font-semibold mb-2">認証コード (6桁)</label>
                    <input type="text" id="totp-input" name="totp_code" class="w-full bg-[#0b121a] text-white border border-slate-700 rounded-xl py-2.5 px-3 focus:outline-none focus:border-teal-400 font-mono text-center text-xl tracking-widest" placeholder="000000" maxlength="6" {% if default_method == 'totp' %}autofocus{% endif %} required autocomplete="one-time-code">
                </div>
                <button type="submit" class="w-full font-bold py-2.5 px-4 rounded-xl transition primary-btn">
                    認証する
                </button>
            </form>

            <!-- WebAuthn -->
            <div id="form-webauthn" class="{% if default_method != 'webauthn' %}hidden{% endif %} text-center py-4">
                <div class="mb-4 text-slate-300">
                    <i class="fas fa-key text-4xl mb-2 text-amber-300"></i>
                    <p>セキュリティキーまたはTouch IDを使用</p>
                </div>
                <button onclick="startWebAuthn()" class="w-full font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 secondary-btn">
                    <i class="fas fa-fingerprint"></i> 認証を開始
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('logout') }}" class="text-sm text-slate-400 hover:text-slate-200">ログイン画面に戻る</a>
        </div>
    </div>

    <script>
        function switchTab(t) {
            const totpForm = document.getElementById('form-totp');
            const webauthnForm = document.getElementById('form-webauthn');
            const totpTab = document.getElementById('tab-totp');
            const webauthnTab = document.getElementById('tab-webauthn');

            if (totpForm) totpForm.classList.add('hidden');
            if (webauthnForm) webauthnForm.classList.add('hidden');
            const targetForm = document.getElementById('form-'+t);
            if (targetForm) targetForm.classList.remove('hidden');
            
            if (totpTab) totpTab.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white cursor-pointer border-b-2 border-transparent";
            if (webauthnTab) webauthnTab.className = "flex-1 py-2 text-sm text-slate-400 hover:text-white cursor-pointer border-b-2 border-transparent";

            const targetTab = document.getElementById('tab-'+t);
            if (targetTab) targetTab.className = "flex-1 py-2 text-sm font-semibold tab-active border-b-2 cursor-default";
        }

        document.getElementById('form-totp').onsubmit = async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('totp-error');
            const btn = e.target.querySelector('button[type="submit"]');
            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "認証中...";

            try {
                const code = document.getElementById('totp-input').value;
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                
                const res = await fetch("{{ url_for('verify_2fa') }}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ totp_code: code })
                });

                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    window.location.href = data.redirect || "{{ url_for('index') }}";
                } else {
                    errEl.innerText = data.error || "認証に失敗しました";
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerText = "認証する";
                }
            } catch (err) {
                console.error(err);
                errEl.innerText = "ネットワークエラーが発生しました";
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "認証する";
            }
        };

        async function startWebAuthn() {
            const btn = document.querySelector('#form-webauthn button');
            const originalText = btn.innerHTML;
            try {
                btn.disabled = true;
                btn.innerText = "認証中...";

                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                
                // 1. Get Options
                const optsRes = await fetch('/verify-2fa/webauthn/options', {
                    method: 'POST',
                    headers: {'X-CSRF-Token': csrfToken}
                });
                if(!optsRes.ok) {
                    const errData = await optsRes.json();
                    throw new Error(errData.error || "Failed to get options");
                }
                const options = await optsRes.json();
                
                // 2. Browser Verification
                const credential = await window.webauthnJSON.get({ publicKey: options });
                
                // 3. Verify on Server
                const verifyRes = await fetch('/verify-2fa/webauthn/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify(credential)
                });
                
                const result = await verifyRes.json();
                if(result.status === 'ok') {
                    window.location.href = "{{ url_for('index') }}";
                } else {
                    alert("Verification failed: " + (result.error || "Unknown error"));
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch(e) {
                console.error(e);
                alert("Auth Error: " + e.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
