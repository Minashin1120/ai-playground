    <!-- Version Update Notification Modal -->
    <div id="version-update-modal" class="fixed inset-0 bg-gray-900/95 z-[80] hidden items-center justify-center modal-overlay app-modal-overlay overflow-y-auto">
        <div class="app-modal-panel app-modal-panel--sm modal-panel">
            <div class="app-modal-header">
                <div class="app-modal-title-wrap">
                    <div class="app-modal-title-icon app-modal-title-icon--info"><i class="fas fa-download"></i></div>
                    <div class="app-modal-title-text">
                        <h2 class="app-modal-title">新しいバージョンが利用可能です</h2>
                        <p class="app-modal-subtitle">ページをリロードして最新版をご利用ください</p>
                    </div>
                </div>
                <button type="button" class="app-modal-close" aria-label="閉じる" onclick="document.getElementById('version-update-dismiss')?.click()"><i class="fas fa-times"></i></button>
            </div>
            <div class="app-modal-body">
                <div class="rounded-lg border border-blue-500/20 bg-blue-950/20 p-3">
                    <label class="flex items-start gap-2 text-sm text-gray-200">
                        <input type="checkbox" id="version-update-clear-cache" class="accent-blue-500 w-4 h-4 mt-0.5">
                        <span class="leading-snug">ローカルキャッシュをスキャンして削除してからリロードする</span>
                    </label>
                    <div class="text-[10px] text-gray-500 mt-1">Cookie は削除しません。設定はアカウント単位で保存されます。</div>
                </div>
            </div>
            <div class="app-modal-footer">
                <button id="version-update-dismiss" type="button" class="app-modal-btn app-modal-btn--ghost">閉じる</button>
                <button id="version-update-reload" class="app-modal-btn app-modal-btn--primary">リロード</button>
            </div>
        </div>
    </div>
