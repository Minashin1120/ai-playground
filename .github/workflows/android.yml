name: Android CI
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/release.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-fixed-signing-key
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.key.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Persist or reuse the fixed keystore
        id: key
        run: bash android/ci/bootstrap-keystore.sh

  build:
    needs: bootstrap
    if: always() && (github.event_name == 'pull_request' || needs.bootstrap.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bootstrap.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact build source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle.kts'
      - name: Check wrapper and fixed signing certificate
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          bash android/ci/verify-keystore.sh
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify APK signature
        run: bash android/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/ci/signing-fingerprint.txt
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [bootstrap, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.build.outputs.sha }}
