<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ export_title }} - PDF Export</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #475569;
            --line: #dbe3ee;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --user: #0ea5e9;
            --ai: #10b981;
            --accent: #0f766e;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        .hidden { display: none !important; }
        body {
            font-family: "Noto Sans JP", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(14, 165, 233, 0.08), transparent 28%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent 26%),
                linear-gradient(180deg, #eef4fb 0%, #f8fbff 45%, #eef2f7 100%);
        }
        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 18px 48px;
        }
        .screen-toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(18px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }
        .screen-toolbar .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .brand strong {
            font-size: 18px;
            letter-spacing: 0.01em;
        }
        .brand span {
            color: var(--muted);
            font-size: 12px;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            appearance: none;
            border: 1px solid rgba(15, 23, 42, 0.12);
            background: linear-gradient(180deg, #fff, #eef4fb);
            color: var(--ink);
            border-radius: 999px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        .btn:hover { transform: translateY(-1px); border-color: rgba(14, 165, 233, 0.35); }
        .btn.primary {
            border-color: rgba(14, 165, 233, 0.3);
            background: linear-gradient(180deg, rgba(14, 165, 233, 0.14), rgba(14, 116, 144, 0.08));
        }
        .cover {
            position: relative;
            overflow: hidden;
            border-radius: 26px;
            padding: 26px 24px;
            color: #eff6ff;
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.22), transparent 28%),
                linear-gradient(135deg, #0f172a 0%, #0b3b57 56%, #0f766e 100%);
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
        }
        .cover::after {
            content: "";
            position: absolute;
            inset: auto -8% -36% auto;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 66%);
            pointer-events: none;
        }
        .cover h1 {
            margin: 0 0 8px;
            font-size: clamp(26px, 4vw, 40px);
            line-height: 1.1;
            letter-spacing: 0.01em;
        }
        .cover p {
            margin: 0;
            max-width: 72ch;
            color: rgba(226, 232, 240, 0.88);
            font-size: 14px;
            line-height: 1.8;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }
        .meta-card {
            padding: 12px 14px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
        }
        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(226, 232, 240, 0.68);
            margin-bottom: 6px;
        }
        .meta-value {
            font-size: 14px;
            font-weight: 700;
            word-break: break-word;
        }
        .message-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            border-radius: 22px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .message.user { border-left: 6px solid var(--user); }
        .message.ai { border-left: 6px solid var(--ai); }
        .message-head {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 18px 0;
        }
        .message-role {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.02em;
        }
        .message-role .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            flex: 0 0 auto;
        }
        .message-time {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }
        .message-body {
            padding: 12px 18px 18px;
        }
        .quote {
            margin: 0 0 12px;
            padding: 10px 12px;
            border-left: 4px solid rgba(14, 165, 233, 0.7);
            background: var(--panel-soft);
            color: var(--muted);
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.7;
        }
        .thought {
            margin: 12px 0 0;
            padding: 12px 14px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.04));
            border: 1px solid rgba(139, 92, 246, 0.18);
            color: #4c1d95;
            font-size: 12px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .content {
            font-size: 14px;
            line-height: 1.85;
            word-break: break-word;
        }
        .content :first-child { margin-top: 0; }
        .content :last-child { margin-bottom: 0; }
        .content pre {
            overflow: auto;
            padding: 12px 14px;
            border-radius: 14px;
            background: #0b1020;
            color: #e2e8f0;
            border: 1px solid rgba(15, 23, 42, 0.18);
        }
        .content code {
            font-family: "Noto Sans Mono", "JetBrains Mono", ui-monospace, monospace;
            font-size: 0.95em;
        }
        .content blockquote {
            margin: 12px 0;
            padding: 8px 12px;
            border-left: 4px solid rgba(14, 165, 233, 0.65);
            background: rgba(14, 165, 233, 0.06);
            border-radius: 10px;
            color: #334155;
        }
        .content img {
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            margin: 10px 0;
        }
        .attachments {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .attachment {
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #f8fafc;
            overflow: hidden;
            break-inside: avoid;
        }
        .attachment img {
            width: 100%;
            height: auto;
            display: block;
        }
        .attachment .file {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 14px;
            color: var(--ink);
            text-decoration: none;
        }
        .attachment .file .name {
            font-weight: 700;
            font-size: 13px;
            word-break: break-word;
        }
        .attachment .file .hint {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }
        .message-meta {
            margin-top: 14px;
            text-align: right;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
            font-family: "Noto Sans Mono", "JetBrains Mono", ui-monospace, monospace;
        }
        .empty {
            margin-top: 18px;
            padding: 28px;
            border-radius: 20px;
            border: 1px dashed rgba(148, 163, 184, 0.5);
            background: rgba(255, 255, 255, 0.78);
            color: var(--muted);
            text-align: center;
        }
        .screen-note {
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px;
        }
        @media print {
            body { background: #fff; }
            .screen-toolbar { display: none !important; }
            .page { padding: 0; max-width: none; }
            .cover {
                box-shadow: none;
                border-radius: 0;
            }
            .message {
                box-shadow: none;
            }
            .message, .attachment, .meta-card, .empty {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            a { color: inherit; text-decoration: none; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="screen-toolbar">
            <div class="row">
                <div class="brand">
                    <strong>PDF export ready</strong>
                    <span>ブラウザの印刷ダイアログから「PDFとして保存」を選べます。</span>
                </div>
                <div class="actions">
                    <button class="btn primary" id="print-btn">印刷 / PDF保存</button>
                    <button class="btn" id="close-btn">閉じる</button>
                </div>
            </div>
            <div class="screen-note">全メッセージはサーバー側で再取得しているため、未読込部分が抜けたままPDF化されることはありません。</div>
        </div>

        <section class="cover">
            <h1>{{ export_title }}</h1>
            <p>スレッド ID: {{ thread_public_id }}。表示中の履歴をそのまま印刷できるように、画面キャプチャではなく全メッセージを再構成して出力しています。</p>
            <div class="meta-grid">
                <div class="meta-card">
                    <div class="meta-label">Exported At</div>
                    <div class="meta-value" id="exported-at"></div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Leaf Message</div>
                    <div class="meta-value" id="leaf-message"></div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Messages</div>
                    <div class="meta-value" id="message-count"></div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Version</div>
                    <div class="meta-value">AI Playground {{ app_version }}</div>
                </div>
            </div>
        </section>

        <main id="message-list" class="message-list"></main>
        <div id="empty-state" class="empty hidden">このスレッドにはメッセージがありません。</div>
    </div>

    <script>
        DOMPurify.setConfig({
            ADD_TAGS: ['video', 'source', 'iframe'],
            ADD_ATTR: ['controls', 'src', 'class', 'autoplay', 'loop', 'muted', 'poster', 'width', 'height', 'allow', 'allowfullscreen', 'frameborder', 'scrolling', 'loading', 'target', 'rel']
        });

        const exportData = {{ export_payload | tojson }};
        marked.setOptions({ breaks: true, gfm: true });

        const get = (id) => document.getElementById(id);

        function normalizeAttachmentPath(path) {
            if (!path) return '';
            let v = String(path).trim();
            if (!v) return '';
            try {
                if (v.includes('://')) {
                    v = new URL(v, window.location.origin).pathname || '';
                }
            } catch (e) {}
            if (v.includes('?')) v = v.split('?', 1)[0];
            if (v.includes('#')) v = v.split('#', 1)[0];
            v = v.replace(/^\/+/, '');
            if (v.startsWith('files/')) v = v.slice(6);
            try { v = decodeURIComponent(v); } catch (e) {}
            return v;
        }

        function buildFileUrl(path) {
            const norm = normalizeAttachmentPath(path);
            if (!norm) return '';
            return `${window.location.origin}/files/${encodeURI(norm)}`;
        }

        function buildPreviewUrl(path) {
            const norm = normalizeAttachmentPath(path);
            if (!norm) return '';
            return `${window.location.origin}/files/thumb/${encodeURI(norm)}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            return DOMPurify.sanitize(marked.parse(String(text || '')));
        }

        function parseAttachments(rawImageUrl) {
            if (!rawImageUrl) return [];
            let parsed = [];
            try {
                parsed = JSON.parse(rawImageUrl);
            } catch (e) {
                parsed = [rawImageUrl];
            }
            if (!Array.isArray(parsed)) parsed = [parsed];
            return parsed.map((item) => {
                let source = 'unknown';
                let path = item;
                if (item && typeof item === 'object') {
                    source = String(item.source || 'unknown').toLowerCase();
                    path = item.filepath || item.path || item.url || item.file || '';
                }
                const norm = normalizeAttachmentPath(path);
                if (!norm) return null;
                const filename = norm.split('/').pop();
                const ext = (filename.split('.').pop() || '').toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'avif', 'svg'].includes(ext);
                return {
                    path: norm,
                    filename,
                    source,
                    isImage,
                    url: buildFileUrl(norm),
                    previewUrl: isImage ? buildPreviewUrl(norm) : buildFileUrl(norm)
                };
            }).filter(Boolean);
        }

        function formatTimestamp(ts) {
            if (!ts) return '';
            try {
                const date = new Date(ts);
                if (Number.isNaN(date.getTime())) return String(ts);
                return new Intl.DateTimeFormat('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }).format(date);
            } catch (e) {
                return String(ts);
            }
        }

        function renderAttachment(attachment) {
            if (attachment.isImage) {
                return `
                    <div class="attachment">
                        <img src="${attachment.previewUrl}" alt="${escapeHtml(attachment.filename)}" loading="eager">
                        <div style="padding: 10px 12px; font-size: 11px; color: var(--muted);">
                            ${escapeHtml(attachment.filename)}
                        </div>
                    </div>
                `;
            }
            return `
                <div class="attachment">
                    <a class="file" href="${attachment.url}" target="_blank" rel="noreferrer noopener">
                        <div style="font-size: 18px; color: var(--accent);">📄</div>
                        <div>
                            <div class="name">${escapeHtml(attachment.filename)}</div>
                            <div class="hint">${escapeHtml(attachment.source || 'attachment')}</div>
                        </div>
                    </a>
                </div>
            `;
        }

        function renderMessage(message) {
            const isUser = message.role === 'user';
            const wrapper = document.createElement('article');
            wrapper.className = `message ${isUser ? 'user' : 'ai'}`;

            const attachments = Array.isArray(message.attachments) ? message.attachments : parseAttachments(message.image_url);
            const quoteHtml = message.quote_text ? `<div class="quote"><strong>Quote</strong><br>${escapeHtml(message.quote_text)}</div>` : '';
            const thoughtHtml = message.thought_text ? `<div class="thought">${escapeHtml(message.thought_text)}</div>` : '';
            const contentHtml = isUser
                ? `<div class="content" style="white-space: pre-wrap;">${escapeHtml(message.content || '')}</div>`
                : `<div class="content">${renderMarkdown(message.content || '')}</div>`;
            const attachmentsHtml = attachments.length
                ? `<div class="attachments">${attachments.map(renderAttachment).join('')}</div>`
                : '';
            const metaBits = [];
            if (message.model && !isUser) metaBits.push(message.model);
            if (message.tokens !== null && message.tokens !== undefined) metaBits.push(`tokens:${message.tokens}`);
            if (message.tokens_in !== null && message.tokens_in !== undefined) metaBits.push(`in:${message.tokens_in}`);
            if (message.tokens_out !== null && message.tokens_out !== undefined) metaBits.push(`out:${message.tokens_out}`);
            if (message.tokens_thought !== null && message.tokens_thought !== undefined) metaBits.push(`thought:${message.tokens_thought}`);
            if (message.is_encrypted) metaBits.push('encrypted');
            if (message.parent_id !== null && message.parent_id !== undefined) metaBits.push(`parent:#${message.parent_id}`);
            const metaHtml = metaBits.length
                ? `<div class="message-meta">${escapeHtml(metaBits.join(' • '))}</div>`
                : '';

            wrapper.innerHTML = `
                <div class="message-head">
                    <div class="message-role" style="color:${isUser ? 'var(--user)' : 'var(--ai)'}">
                        <span class="dot"></span>
                        <span>${isUser ? 'User' : 'Assistant'}</span>
                    </div>
                    <div class="message-time">${escapeHtml(formatTimestamp(message.timestamp))}</div>
                </div>
                <div class="message-body">
                    ${quoteHtml}
                    ${contentHtml}
                    ${thoughtHtml}
                    ${attachmentsHtml}
                    ${metaHtml}
                </div>
            `;
            return wrapper;
        }

        async function waitForImages(root) {
            const imgs = Array.from(root.querySelectorAll('img'));
            await Promise.all(imgs.map((img) => {
                if (img.complete) return Promise.resolve();
                return new Promise((resolve) => {
                    img.addEventListener('load', resolve, { once: true });
                    img.addEventListener('error', resolve, { once: true });
                });
            }));
        }

        async function renderExport() {
            const list = get('message-list');
            const empty = get('empty-state');
            const messages = Array.isArray(exportData.messages) ? exportData.messages : [];
            get('exported-at').textContent = formatTimestamp(exportData.generated_at);
            get('leaf-message').textContent = exportData.leaf_id ? `#${exportData.leaf_id}` : 'none';
            get('message-count').textContent = String(messages.length);
            if (!messages.length) {
                empty.classList.remove('hidden');
                return;
            }
            messages.forEach((message) => {
                list.appendChild(renderMessage(message));
            });
            await waitForImages(list);
            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) {}
            }
        }

        async function printWhenReady() {
            await renderExport();
            requestAnimationFrame(() => {
                setTimeout(() => window.print(), 250);
            });
        }

        get('print-btn').addEventListener('click', () => window.print());
        get('close-btn').addEventListener('click', () => window.close());
        window.addEventListener('afterprint', () => {
            try { window.close(); } catch (e) {}
        });
        window.addEventListener('load', printWhenReady);
    </script>
</body>
</html>
