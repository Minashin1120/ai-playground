<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メンテナンス中 - AI Chat</title>
    {% include 'pwa_meta.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.tailwind.' ~ (system_version | lower) ~ '.css') }}?v={{ app_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-design.css') }}?v={{ app_version }}">
    <script src="{{ url_for('static', filename='js/pwa_install.min.js') }}?v={{ app_version }}" defer></script>
    {% include 'icon_css.html' %}
    {% include 'web_fonts.html' %}
    <style>
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(900px 520px at 20% -10%, rgba(245,158,11,0.16), transparent 55%),
                        radial-gradient(700px 520px at 85% 0%, rgba(13,212,191,0.14), transparent 60%),
                        linear-gradient(180deg, #05070f, #080c18);
            color: var(--text, #e8eaef);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(226, 232, 240, 0.04) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
            opacity: 0.35;
        }
        .maint-card {
            background: rgba(10, 16, 35, 0.88);
            border: 1px solid rgba(148,163,184,0.14);
            box-shadow: 0 26px 60px rgba(0,0,0,0.5);
            border-radius: 22px;
            padding: 32px 36px;
            backdrop-filter: blur(22px) saturate(170%);
            -webkit-backdrop-filter: blur(22px) saturate(170%);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="maint-card text-center space-y-6">
        <div class="text-amber-300 text-6xl animate-pulse"><i class="fas fa-tools"></i></div>
        <h1 class="text-3xl font-bold">システムメンテナンス中</h1>
        <p class="text-slate-400">現在、データ移行処理などを行っております。<br>しばらくしてから再度アクセスしてください。</p>
        <form method="POST" action="{{ url_for('logout') }}" class="mt-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="text-sm text-slate-400 hover:text-white underline">ログアウト</button>
        </form>
    </div>
</body>
</html>
