<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - AI Chat</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module">
        import { get } from 'https://esm.sh/@github/webauthn-json@2.1.1';
        window.webauthnJSON = { get };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0f14;
            --bg-2: #0f1720;
            --panel: #0c141e;
            --line: #1c2636;
            --text: #e5e7eb;
            --muted: #9aa3b2;
            --accent: #14b8a6;
            --accent-2: #f59e0b;
            --danger: #fb7185;
        }
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(800px 520px at 15% -10%, rgba(20,184,166,0.2), transparent 55%),
                        radial-gradient(700px 520px at 85% 0%, rgba(245,158,11,0.18), transparent 60%),
                        linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.05) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.05) 98%);
            background-size: 38px 38px;
            pointer-events: none;
            opacity: 0.35;
        }
        .auth-card {
            background: rgba(11,18,26,0.9);
            border: 1px solid rgba(148,163,184,0.2);
            box-shadow: 0 26px 60px rgba(0,0,0,0.45);
            backdrop-filter: blur(14px);
        }
        .auth-title {
            background: linear-gradient(135deg, #5eead4, #f59e0b);
            -webkit-background-clip: text;
            color: transparent;
        }
        .input-field {
            background: #0b121a;
            border: 1px solid var(--line);
        }
        .input-field:focus {
            border-color: rgba(20,184,166,0.8);
            box-shadow: 0 0 0 2px rgba(20,184,166,0.25);
        }
        .primary-btn {
            background: linear-gradient(135deg, #14b8a6, #0ea5a4);
            color: #041014;
            box-shadow: 0 14px 30px rgba(20,184,166,0.3);
        }
        .secondary-btn {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #1f1303;
            box-shadow: 0 12px 28px rgba(245,158,11,0.3);
        }
        .ghost-btn {
            background: rgba(15,23,32,0.8);
            border: 1px solid rgba(148,163,184,0.2);
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-center p-4">
    <div class="auth-card p-8 rounded-2xl w-full max-w-sm">
        <h1 class="text-3xl mb-8 font-bold text-center auth-title">AI Chat Login</h1>
        {% if error %}
        <div class="bg-rose-500/15 text-rose-200 p-3 rounded-lg mb-4 text-sm text-center border border-rose-400/40">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">ユーザー名</label>
                <input type="text" name="username" required class="w-full p-3 rounded-xl text-white outline-none input-field">
            </div>
            <div>
                <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">パスワード</label>
                <input type="password" name="password" required class="w-full p-3 rounded-xl text-white outline-none input-field">
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="remember" id="remember" class="w-4 h-4 bg-gray-700 border-gray-600 rounded">
                <label for="remember" class="ml-2 text-sm text-slate-300">ログイン状態を保持</label>
            </div>
            {% if site_key %}
            <div class="flex justify-center"><div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark"></div></div>
            {% endif %}
            <button type="submit" class="w-full font-bold py-3 rounded-xl transition primary-btn">ログイン</button>
        </form>
        <div class="mt-6 pt-6 border-t border-slate-700/60">
            <h2 class="text-sm font-bold text-slate-200 mb-3 text-center">パスキーでログイン</h2>
            <div id="passkey-error" class="hidden bg-rose-500/15 text-rose-200 p-2 rounded mb-3 text-xs text-center border border-rose-400/40"></div>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] mb-1 font-semibold text-slate-300 uppercase tracking-[0.18em]">ユーザー名</label>
                    <input type="text" id="passkey-username" class="w-full p-3 rounded-xl text-white outline-none input-field">
                </div>
                <button id="passkey-login-btn" type="button" class="w-full font-bold py-2.5 rounded-xl transition secondary-btn">パスキーでログイン</button>
                <div class="text-[11px] text-slate-400 text-center">パスキーのみログインを有効化したアカウントで利用できます。</div>
            </div>
        </div>
        <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
            <p class="text-sm text-slate-400 mb-3">アカウントをお持ちでない方</p>
            <a href="/signup" class="inline-block w-full text-white font-bold py-2 rounded-xl transition text-sm ghost-btn">新規アカウント作成</a>
        </div>
    </div>
    <script>
        const getTurnstileToken = () => {
            const el = document.querySelector('[name="cf-turnstile-response"]');
            return el ? el.value : '';
        };
        const showPasskeyError = (msg) => {
            const box = document.getElementById('passkey-error');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
        };
        const clearPasskeyError = () => {
            const box = document.getElementById('passkey-error');
            if (box) box.classList.add('hidden');
        };
        document.getElementById('passkey-login-btn').onclick = async () => {
            clearPasskeyError();
            const usernameInput = document.querySelector('input[name="username"]');
            const username = (document.getElementById('passkey-username').value || (usernameInput ? usernameInput.value : '') || '').trim();
            if (!username) { showPasskeyError('ユーザー名を入力してください'); return; }
            const token = getTurnstileToken();
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
            try {
                const optsRes = await fetch('/login/passkey/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify({ username, remember: document.getElementById('remember')?.checked || false, turnstile: token })
                });
                const options = await optsRes.json();
                if (!optsRes.ok) { showPasskeyError(options.error || 'パスキーの準備に失敗しました'); return; }
                const credential = await window.webauthnJSON.get({ publicKey: options });
                const verifyRes = await fetch('/login/passkey/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify(credential)
                });
                const verifyData = await verifyRes.json();
                if (verifyRes.ok) { window.location.href = '/'; }
                else { showPasskeyError(verifyData.error || 'ログインに失敗しました'); }
            } catch (e) {
                showPasskeyError('パスキー認証に失敗しました');
            }
        };
    </script>
</body>
</html>
