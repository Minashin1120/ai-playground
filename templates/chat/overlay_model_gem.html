    <!-- Model Selector Modal (unified with Settings Modal design) -->
    <div id="model-modal" class="fixed inset-0 z-[60] hidden items-center justify-center modal-overlay model-modal-root overflow-hidden">
        <div class="model-modal-panel modal-panel">
            <div class="model-header">
                <div class="model-title-wrap">
                    <div class="model-title-icon"><i class="fas fa-robot"></i></div>
                    <div class="model-title-text">
                        <h2 class="model-modal-title">Select Model</h2>
                        <p class="model-modal-subtitle">使用するモデルを選択してください</p>
                    </div>
                </div>
                <button type="button" onclick="closeModelModal()" data-progress-no-spinner="true" class="model-close-btn" title="閉じる" aria-label="閉じる"><i class="fas fa-times"></i></button>
            </div>
            <div class="model-toolbar">
                <div class="model-search-box">
                    <i class="model-search-icon fas fa-search" aria-hidden="true"></i>
                    <input type="text" id="model-search" placeholder="Search models or capabilities..." autocomplete="off" spellcheck="false">
                    <button type="button" id="model-search-clear" class="model-search-clear hidden" aria-label="検索をクリア"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div id="model-tag-bar" class="model-tag-bar">
                <button type="button" class="model-tag-btn is-active">All</button>
                <button type="button" class="model-tag-btn">OpenAI</button>
                <button type="button" class="model-tag-btn">Gemini</button>
                <button type="button" class="model-tag-btn">Anthropic</button>
                <button type="button" class="model-tag-btn">Kimi</button>
                <button type="button" class="model-tag-btn">DeepSeek</button>
                <button type="button" class="model-tag-btn">Mistral</button>
                <button type="button" class="model-tag-btn">xAI</button>
                <button type="button" class="model-tag-btn">Image</button>
                <button type="button" class="model-tag-btn">Video</button>
                <button type="button" class="model-tag-btn">Audio</button>
                <button type="button" class="model-tag-btn">Music</button>
                <button type="button" class="model-tag-btn">Transcription</button>
                <button type="button" class="model-tag-btn">OCR</button>
                <button type="button" class="model-tag-btn">Reasoning</button>
                <button type="button" class="model-tag-btn">Fast</button>
                <button type="button" class="model-tag-btn">Agent</button>
                <button type="button" class="model-tag-btn">Agentic View</button>
            </div>
            <div id="model-list-container" class="model-modal-body">
                <!-- Models rendered by JS -->
            </div>
        </div>
    </div>

    <!-- Gem Modal -->
    <div id="gem-modal" class="fixed inset-0 bg-gray-900/95 z-50 hidden items-start sm:items-center justify-center backdrop-blur-sm modal-overlay overflow-y-auto">
        <div class="bg-gray-800 rounded-lg w-full max-w-lg p-6 shadow-2xl border border-gray-700 m-4 flex flex-col modal-panel">
            <h2 class="text-xl font-bold text-white mb-4" id="gem-modal-title"><i class="fas fa-gem text-blue-500 mr-2"></i>Create New Gem</h2>
            <div class="space-y-4">
                <div><label class="block text-xs text-gray-400 mb-1">Name</label><input type="text" id="gem-name" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="My Helper"></div>
                <div><label class="block text-xs text-gray-400 mb-1">Description (Optional)</label><input type="text" id="gem-desc" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="A short description..."></div>
                <div><label class="block text-xs text-gray-400 mb-1">System Instruction</label><textarea id="gem-inst" class="w-full h-32 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="You are a helpful assistant..."></textarea></div>
                <div><label class="block text-xs text-gray-400 mb-1">Default Model (optional)</label><select id="gem-default-model" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm"><option value="">Use current model</option></select></div>
                
                <div class="pt-4 border-t border-gray-700">
                    <label class="block text-xs font-bold text-indigo-400 mb-2 uppercase tracking-wider">Fixed Prompts (Gem specific)</label>
                    <div id="gem-fixed-prompts-container" class="space-y-2 mb-2">
                        <!-- Dynamic rows -->
                    </div>
                    <button type="button" id="add-gem-fixed-prompt-row" class="text-[10px] bg-gray-700 hover:bg-gray-600 text-gray-300 px-2 py-1 rounded transition"><i class="fas fa-plus mr-1"></i>プロンプトを追加</button>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeGemModal()" data-progress-no-spinner="true" class="px-4 py-2 text-gray-400 hover:text-white transition">Cancel</button>
                <button id="save-gem-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold btn-hover">Save Gem</button>
            </div>
        </div>
    </div>
