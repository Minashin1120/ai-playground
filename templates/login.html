<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - AI Chat</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module">
        import { get } from 'https://esm.sh/@github/webauthn-json@2.1.1';
        window.webauthnJSON = { get };
    </script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm border border-gray-700">
        <h1 class="text-3xl mb-8 font-bold text-center text-blue-500">AI Chat Login</h1>
        {% if error %}
        <div class="bg-red-500/20 text-red-200 p-3 rounded mb-4 text-sm text-center border border-red-500/50">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-gray-400 text-xs mb-1 font-bold">ユーザー名</label>
                <input type="text" name="username" required class="w-full p-3 rounded bg-gray-900 border border-gray-600 focus:border-blue-500 text-white outline-none">
            </div>
            <div>
                <label class="block text-gray-400 text-xs mb-1 font-bold">パスワード</label>
                <input type="password" name="password" required class="w-full p-3 rounded bg-gray-900 border border-gray-600 focus:border-blue-500 text-white outline-none">
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="remember" id="remember" class="w-4 h-4 bg-gray-700 border-gray-600 rounded">
                <label for="remember" class="ml-2 text-sm text-gray-300">ログイン状態を保持</label>
            </div>
            {% if site_key %}
            <div class="flex justify-center"><div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark"></div></div>
            {% endif %}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg">ログイン</button>
        </form>
        <div class="mt-6 pt-6 border-t border-gray-700">
            <h2 class="text-sm font-bold text-gray-300 mb-3 text-center">パスキーでログイン</h2>
            <div id="passkey-error" class="hidden bg-red-500/20 text-red-200 p-2 rounded mb-3 text-xs text-center border border-red-500/50"></div>
            <div class="space-y-3">
                <div>
                    <label class="block text-gray-400 text-xs mb-1 font-bold">ユーザー名</label>
                    <input type="text" id="passkey-username" class="w-full p-3 rounded bg-gray-900 border border-gray-600 focus:border-green-500 text-white outline-none">
                </div>
                <button id="passkey-login-btn" type="button" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg">パスキーでログイン</button>
                <div class="text-[11px] text-gray-500 text-center">パスキーのみログインを有効化したアカウントで利用できます。</div>
            </div>
        </div>
        <div class="mt-6 pt-6 border-t border-gray-700 text-center">
            <p class="text-sm text-gray-400 mb-3">アカウントをお持ちでない方</p>
            <a href="/signup" class="inline-block w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition text-sm">新規アカウント作成</a>
        </div>
    </div>
    <script>
        const getTurnstileToken = () => {
            const el = document.querySelector('[name="cf-turnstile-response"]');
            return el ? el.value : '';
        };
        const showPasskeyError = (msg) => {
            const box = document.getElementById('passkey-error');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
        };
        const clearPasskeyError = () => {
            const box = document.getElementById('passkey-error');
            if (box) box.classList.add('hidden');
        };
        document.getElementById('passkey-login-btn').onclick = async () => {
            clearPasskeyError();
            const usernameInput = document.querySelector('input[name="username"]');
            const username = (document.getElementById('passkey-username').value || (usernameInput ? usernameInput.value : '') || '').trim();
            if (!username) { showPasskeyError('ユーザー名を入力してください'); return; }
            const token = getTurnstileToken();
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
            try {
                const optsRes = await fetch('/login/passkey/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify({ username, remember: document.getElementById('remember')?.checked || false, turnstile: token })
                });
                const options = await optsRes.json();
                if (!optsRes.ok) { showPasskeyError(options.error || 'パスキーの準備に失敗しました'); return; }
                const credential = await window.webauthnJSON.get({ publicKey: options });
                const verifyRes = await fetch('/login/passkey/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
                    body: JSON.stringify(credential)
                });
                const verifyData = await verifyRes.json();
                if (verifyRes.ok) { window.location.href = '/'; }
                else { showPasskeyError(verifyData.error || 'ログインに失敗しました'); }
            } catch (e) {
                showPasskeyError('パスキー認証に失敗しました');
            }
        };
    </script>
</body>
</html>
