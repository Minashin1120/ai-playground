<VirtualHost *:80>
    ServerName chat.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName chat.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chat.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chat.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Versioned JS/CSS/fonts are immutable. Serve them from disk so Gunicorn
    # is not involved in every static request.
    Alias /static /opt/ai-playground/static
    <Directory /opt/ai-playground/static>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    ProxyPass /static !

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>

    ProxyPass / http://127.0.0.1:3111/ connectiontimeout=5 timeout=660 retry=0
    ProxyPassReverse / http://127.0.0.1:3111/
    ProxyTimeout 660
    SetEnv proxy-sendchunked 1

    # 512 MiB。UPLOAD_MAX_MBとCDN側上限も合わせること。
    LimitRequestBody 536870912
    RequestReadTimeout header=20-40,MinRate=500 body=0

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/ai-playground-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-playground-access.log combined
</VirtualHost>
</IfModule>
