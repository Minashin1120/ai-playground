    <!-- Version Update Notification Modal -->
    <div id="version-update-modal" class="fixed inset-0 bg-gray-900/95 z-[80] hidden items-center justify-center modal-glass-overlay modal-overlay overflow-y-auto">
        <div class="rounded-lg w-full max-w-sm p-6 m-4 modal-panel modal-glass-panel">
            <div class="flex items-start gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-download text-blue-400 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h2 class="text-base font-bold text-white">新しいバージョンが利用可能です</h2>
                    <p class="text-sm text-gray-400 mt-1">ページをリロードして最新版をご利用ください</p>
                </div>
            </div>
            <div class="rounded-lg border border-blue-500/20 bg-blue-950/20 p-3 mb-4">
                <label class="flex items-start gap-2 text-sm text-gray-200">
                    <input type="checkbox" id="version-update-clear-cache" class="accent-blue-500 w-4 h-4 mt-0.5">
                    <span class="leading-snug">ローカルキャッシュをスキャンして削除してからリロードする</span>
                </label>

            </div>
            <div class="flex justify-end gap-2">
                <button id="version-update-dismiss" class="px-4 py-2 text-sm rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 transition">閉じる</button>
                <button id="version-update-reload" class="px-4 py-2 text-sm rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition font-medium">リロード</button>
            </div>
        </div>
    </div>
