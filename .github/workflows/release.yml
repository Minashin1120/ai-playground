name: Android Release
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      # Android CI runs the unit tests on this commit in its build job, which publishing waits for.
      skip_unit_tests:
        required: false
        default: false
        type: boolean
      # Android CI builds the release APK alongside its debug build ('build') and publishes it
      # in a second call ('publish') only after both jobs succeed. Other triggers run both stages.
      stage:
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Commit or ref on main to build'
        required: true
        default: main
        type: string
      tag_name:
        description: 'Optional android-vX.Y.Z; must match version.properties'
        required: false
        default: ''
        type: string
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    if: inputs.stage != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.ref }}
          fetch-depth: 0
      - &validate
        name: Validate source and release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          STAGE: ${{ inputs.stage || 'all' }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          VERSION=$(sed -n 's/^VERSION_NAME=//p' android/version.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NOTES_FILE="android/ci/changelogs/v$VERSION.md"
          [[ -f "$NOTES_FILE" ]]
          TAG="android-v$VERSION"
          [[ -z "$INPUT_TAG" || "$INPUT_TAG" == "$TAG" ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then [[ "${GITHUB_REF#refs/tags/}" == "$TAG" ]]; fi
          # Android CI verifies every build input change, but only a new VERSION_NAME is released.
          PUBLISH=true
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              [[ "$STAGE" != all ]] || {
                echo 'Version already belongs to another commit. Increment Android version.properties.' >&2; exit 1;
              }
              echo "::notice title=No Android release::$TAG belongs to an earlier commit; VERSION_NAME is unchanged, so this commit is only verified."
              PUBLISH=false
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle.kts'
      - name: Verify fixed keystore and Gradle wrapper
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          bash android/ci/verify-keystore.sh
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build and validate release APK
        working-directory: android
        env:
          SKIP_UNIT_TESTS: ${{ inputs.skip_unit_tests && 'true' || 'false' }}
        run: |
          tasks="lintRelease assembleRelease"
          if [ "$SKIP_UNIT_TESTS" != "true" ]; then
            tasks="testDebugUnitTest $tasks"
          fi
          ./gradlew --no-daemon $tasks --stacktrace
      - name: Verify release signature
        run: bash android/ci/verify-apk.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
            android/ci/signing-fingerprint.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: release
    if: ${{ !cancelled() && inputs.stage != 'build' && (needs.release.result == 'success' || inputs.stage == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - *checkout
      - *validate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          name: app-release-signed
          path: ${{ runner.temp }}/release
      - name: Check the downloaded APK
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum -c app/build/outputs/apk/release/app-release.apk.sha256
          cmp ci/signing-fingerprint.txt "$GITHUB_WORKSPACE/android/ci/signing-fingerprint.txt"
      - name: Publish the verified APK
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$(git rev-parse "$TAG^{commit}")" == "$SOURCE_SHA" ]] || {
              echo 'Version already belongs to another commit. Increment Android version.properties.' >&2; exit 1;
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c tag.gpgsign=false tag -a "$TAG" "$SOURCE_SHA" -m 'Verified Android APK with the fixed signing certificate'
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing release retained; assets are not overwritten.'
          else
            gh release create "$TAG" --verify-tag --title "AI Playground Android ${TAG#android-v}" \
              --notes-file "$NOTES_FILE" \
              "$RUNNER_TEMP/release/app/build/outputs/apk/release/app-release.apk" \
              "$RUNNER_TEMP/release/app/build/outputs/apk/release/app-release.apk.sha256" \
              android/ci/signing-fingerprint.txt
          fi
