<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初期セットアップ - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .animate-enter { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .btn-glow { transition: all 0.3s; }
        .btn-glow:hover { box-shadow: 0 0 15px rgba(37, 99, 235, 0.5); transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden animate-enter">
        <div class="bg-gray-900 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-lg font-bold text-blue-400"><i class="fas fa-magic mr-2"></i>初期セットアップ</h1>
            <div class="text-xs text-gray-500 font-mono">Step <span id="step-num" class="text-white font-bold">1</span> / 2</div>
        </div>
        <form method="POST" id="setup-form" class="p-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <!-- Step 1: Welcome -->
            <div id="step-1" class="space-y-6 text-center">
                <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">AI Chat Playground</h2>
                <p class="text-gray-400 leading-relaxed">最新のAIモデルを自由に試せる、<br>あなただけのプライベートなチャット環境へようこそ。</p>
                <div class="flex justify-center pt-4">
                    <button type="button" onclick="nextStep(2)" class="px-8 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg btn-glow flex items-center gap-2">始める <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
            <!-- Step 2: Keys -->
            <div id="step-2" class="hidden space-y-6 animate-enter">
                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold mb-1 text-green-400"><i class="fas fa-key mr-2"></i>APIキーの設定</h3>
                    <p class="text-sm text-gray-400">使用するAIモデルのAPIキーを入力してください。</p>
                </div>
                <div class="space-y-4">
                    <div class="relative group">
                        <label class="block text-xs text-gray-500 mb-1">OpenAI API Key</label>
                        <input type="password" name="openai_key" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-sm outline-none" placeholder="sk-...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-gray-500 mb-1">Gemini API Key</label>
                        <input type="password" name="gemini_key" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-sm outline-none" placeholder="AIza...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-gray-500 mb-1">xAI API Key</label>
                        <input type="password" name="xai_key" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-sm outline-none" placeholder="xai-...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-gray-500 mb-1">Google API Key (TTS)</label>
                        <input type="password" name="google_key" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-sm outline-none" placeholder="AIza...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-gray-500 mb-1">Google Cloud Project ID (TTS)</label>
                        <input type="text" name="google_project" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-sm outline-none" placeholder="my-project-id">
                    </div>
                    <div class="border-t border-gray-700 pt-4 mt-4">
                        <div class="flex items-center justify-between bg-gray-800 p-3 rounded border border-gray-700">
                            <div><div class="text-sm font-bold text-green-400">E2EE (暗号化)</div><div class="text-[10px] text-gray-500">チャット履歴とファイルを暗号化して保存します。</div></div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" name="enable_e2ee" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between pt-6 border-t border-gray-700">
                    <button type="button" onclick="nextStep(1)" class="text-gray-400 hover:text-white transition">戻る</button>
                    <button type="submit" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg btn-glow transform hover:scale-105 transition">セットアップ完了</button>
                </div>
            </div>
        </form>
    </div>
    <script>
        function nextStep(n) {
            [1,2].forEach(i => {
                const el = document.getElementById('step-'+i);
                if(i === n) { el.classList.remove('hidden'); el.classList.add('animate-enter'); } 
                else { el.classList.add('hidden'); el.classList.remove('animate-enter'); }
            });
            document.getElementById('step-num').innerText = n;
        }
    </script>
</body>
</html>
