<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初期セットアップ - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(900px 520px at 15% -10%, rgba(20,184,166,0.2), transparent 55%),
                        radial-gradient(800px 520px at 85% 0%, rgba(245,158,11,0.18), transparent 60%),
                        linear-gradient(180deg, #0b0f14, #0f1720);
            color: #e5e7eb;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.05) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.05) 98%);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.35;
        }
        .animate-enter { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .btn-glow { transition: all 0.3s; }
        .btn-glow:hover { box-shadow: 0 0 18px rgba(20, 184, 166, 0.45); transform: translateY(-1px); }
        .setup-card { background: rgba(11,18,26,0.92); border: 1px solid rgba(148,163,184,0.2); box-shadow: 0 26px 60px rgba(0,0,0,0.45); backdrop-filter: blur(14px); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full setup-card rounded-2xl overflow-hidden animate-enter">
        <div class="bg-slate-900/60 p-4 border-b border-slate-700/70 flex justify-between items-center">
            <h1 class="text-lg font-bold text-teal-300"><i class="fas fa-magic mr-2"></i>初期セットアップ</h1>
            <div class="text-xs text-slate-400 font-mono">Step <span id="step-num" class="text-white font-bold">1</span> / 2</div>
        </div>
        <form method="POST" id="setup-form" class="p-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <!-- Step 1: Welcome -->
            <div id="step-1" class="space-y-6 text-center">
                <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-teal-300 to-amber-300">AI Chat Playground</h2>
                <p class="text-slate-400 leading-relaxed">最新のAIモデルを自由に試せる、<br>あなただけのプライベートなチャット環境へようこそ。</p>
                <div class="flex justify-center pt-4">
                    <button type="button" onclick="nextStep(2)" class="px-8 py-2 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-900 font-bold rounded-lg shadow-lg btn-glow flex items-center gap-2">始める <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
            <!-- Step 2: Keys -->
            <div id="step-2" class="hidden space-y-6 animate-enter">
                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold mb-1 text-amber-300"><i class="fas fa-key mr-2"></i>APIキーの設定</h3>
                    <p class="text-sm text-slate-400">使用するAIモデルのAPIキーを入力してください。</p>
                </div>
                <div class="space-y-4">
                    <div class="relative group">
                        <label class="block text-xs text-slate-400 mb-1">OpenAI API Key</label>
                        <input type="password" name="openai_key" class="w-full bg-[#0b121a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none" placeholder="sk-...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-slate-400 mb-1">Gemini API Key</label>
                        <input type="password" name="gemini_key" class="w-full bg-[#0b121a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none" placeholder="AIza...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-slate-400 mb-1">xAI API Key</label>
                        <input type="password" name="xai_key" class="w-full bg-[#0b121a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none" placeholder="xai-...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-slate-400 mb-1">Google API Key (TTS)</label>
                        <input type="password" name="google_key" class="w-full bg-[#0b121a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none" placeholder="AIza...">
                    </div>
                    <div class="relative group">
                        <label class="block text-xs text-slate-400 mb-1">Google Cloud Project ID (TTS)</label>
                        <input type="text" name="google_project" class="w-full bg-[#0b121a] border border-slate-700 rounded-xl p-3 text-white text-sm outline-none" placeholder="my-project-id">
                    </div>
                    <div class="border-t border-slate-700/70 pt-4 mt-4">
                        <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded border border-slate-700/70">
                            <div><div class="text-sm font-bold text-teal-300">E2EE (暗号化)</div><div class="text-[10px] text-slate-400">チャット履歴とファイルを暗号化して保存します。</div></div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" name="enable_e2ee" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between pt-6 border-t border-slate-700/70">
                    <button type="button" onclick="nextStep(1)" class="text-slate-400 hover:text-white transition">戻る</button>
                    <button type="submit" class="bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-900 font-bold py-3 px-8 rounded-lg shadow-lg btn-glow transform hover:scale-105 transition">セットアップ完了</button>
                </div>
            </div>
        </form>
    </div>
    <script>
        function nextStep(n) {
            [1,2].forEach(i => {
                const el = document.getElementById('step-'+i);
                if(i === n) { el.classList.remove('hidden'); el.classList.add('animate-enter'); } 
                else { el.classList.add('hidden'); el.classList.remove('animate-enter'); }
            });
            document.getElementById('step-num').innerText = n;
        }
    </script>
</body>
</html>
