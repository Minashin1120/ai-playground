<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初期セットアップ - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
        <div class="bg-gray-900 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-lg font-bold text-blue-400">初期セットアップウィザード</h1>
            <div class="text-xs text-gray-500">Step <span id="step-num">1</span> of 3</div>
        </div>

        <form method="POST" id="setup-form" class="p-6">
            <!-- Step 1: Welcome & GitHub -->
            <div id="step-1" class="space-y-6 text-center">
                <div class="text-6xl text-blue-500 mb-4"><i class="fab fa-github"></i></div>
                <h2 class="text-2xl font-bold">Welcome to AI Chat Playground</h2>
                <p class="text-gray-400">最新のAIモデルを自由に試せる、プライベートなチャット環境へようこそ。</p>
                
                <div class="bg-gray-700/50 p-4 rounded-lg border border-gray-600 my-6">
                    <p class="text-sm mb-2 text-gray-300">このプロジェクトはオープンソースです。</p>
                    <a href="https://github.com/Minashin1120/ai-playground" target="_blank" class="inline-flex items-center gap-2 text-blue-400 hover:text-white transition font-bold">
                        Minashin1120/ai-playground <i class="fas fa-external-link-alt text-xs"></i>
                    </a>
                </div>

                <button type="button" onclick="nextStep(2)" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg">次へ進む</button>
            </div>

            <!-- Step 2: Legal -->
            <div id="step-2" class="hidden space-y-6">
                <h3 class="text-orange-400 font-bold mb-2">利用規約の確認</h3>
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 h-64 overflow-y-auto text-sm text-gray-300">
                    <p>本サービスはアルファ版であり、データが予告なく削除される可能性があります。</p>
                    <p>APIキーは暗号化されて保存されますが、自己責任で管理してください。</p>
                    <br>
                    <p>(詳細は利用規約全文をご確認ください)</p>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="agree-check" class="w-5 h-5 bg-gray-700 border-gray-600 rounded">
                    <label for="agree-check">規約に同意します</label>
                </div>
                <div class="flex justify-between">
                    <button type="button" onclick="nextStep(1)" class="text-gray-400">戻る</button>
                    <button type="button" onclick="nextStep(3)" id="btn-step2" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg disabled:opacity-50" disabled>次へ</button>
                </div>
            </div>

            <!-- Step 3: Keys -->
            <div id="step-3" class="hidden space-y-6">
                <div><h3 class="text-lg font-bold mb-1">APIキーの設定</h3><p class="text-sm text-gray-400">使用するAIモデルのAPIキーを入力してください（後で変更可能）。</p></div>
                <div class="space-y-4">
                    <div><label class="block text-xs text-gray-500 mb-1">OpenAI API Key</label><input type="password" name="openai_key" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="sk-..."></div>
                    <div><label class="block text-xs text-gray-500 mb-1">Gemini API Key</label><input type="password" name="gemini_key" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="AIza..."></div>
                    <div><label class="block text-xs text-gray-500 mb-1">xAI API Key</label><input type="password" name="xai_key" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm" placeholder="xai-..."></div>
                </div>
                <div class="flex justify-between pt-4">
                    <button type="button" onclick="nextStep(2)" class="text-gray-400 hover:text-white">戻る</button>
                    <button type="submit" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg">セットアップ完了</button>
                </div>
            </div>
        </form>
    </div>
    <script>
        function nextStep(n) {
            [1,2,3].forEach(i => document.getElementById('step-'+i).classList.add('hidden'));
            document.getElementById('step-'+n).classList.remove('hidden');
            document.getElementById('step-num').innerText = n;
        }
        document.getElementById('agree-check').addEventListener('change', function() {
            document.getElementById('btn-step2').disabled = !this.checked;
        });
    </script>
</body>
</html>
