<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>更新履歴 - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0f14;
            --bg-2: #0f1720;
            --panel: #0c141e;
            --line: #1c2636;
            --text: #e5e7eb;
            --muted: #9aa3b2;
            --accent: #14b8a6;
            --accent-2: #f59e0b;
        }
        body {
            background: radial-gradient(900px 520px at 15% -10%, rgba(20,184,166,0.2), transparent 55%),
                        radial-gradient(800px 520px at 85% 0%, rgba(245,158,11,0.18), transparent 60%),
                        linear-gradient(180deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
            position: relative;
            font-size: 16px;
            line-height: 1.7;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(transparent 97%, rgba(148,163,184,0.05) 98%),
                              linear-gradient(90deg, transparent 97%, rgba(148,163,184,0.05) 98%);
            background-size: 44px 44px;
            pointer-events: none;
            opacity: 0.35;
        }
        .markdown-body { font-size: 1rem; line-height: 1.75; }
        .markdown-body h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 0.7em; color: #5eead4; border-bottom: 1px solid rgba(148,163,184,0.2); }
        .markdown-body p { margin-bottom: 0.8em; color: var(--muted); font-size: 1rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.4em; margin-bottom: 1em; color: #d1d5db; font-size: 1rem; }
        .markdown-body li { margin-bottom: 0.35em; }
        @media (min-width: 768px) {
            body { font-size: 15px; }
            .markdown-body { font-size: 0.98rem; }
            .markdown-body h1 { font-size: 1.6em; }
            .markdown-body p { font-size: 0.95rem; }
            .markdown-body ul { font-size: 0.95rem; }
        }
        .log-card { background: rgba(11,18,26,0.9); border: 1px solid rgba(148,163,184,0.2); box-shadow: 0 22px 50px rgba(0,0,0,0.4); backdrop-filter: blur(12px); }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-white"><i class="fas fa-history text-amber-300 mr-3"></i> 更新履歴</h1>
            <a href="/" class="px-4 py-2 bg-slate-900/70 hover:bg-slate-800 text-white rounded-lg border border-slate-700 transition">戻る</a>
        </div>
        <div id="changelog-container" class="space-y-8">
            {% for log in logs %}
            <div class="log-card p-6 rounded-xl">
                {% if log.title %}
                <div class="text-teal-300 font-semibold text-sm mb-2">{{ log.title }}</div>
                {% endif %}
                <div class="markdown-body">{{ log.content }}</div>
            </div>
            {% endfor %}
        </div>

        <div id="loading-trigger" class="py-10 flex justify-center items-center">
            <div id="spinner" class="loading-spinner hidden"></div>
            <div id="no-more" class="text-gray-500 text-sm hidden">これ以上の履歴はありません</div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const limit = {{ limit }};
        const totalItems = {{ total }};
        let isLoading = false;
        let hasMore = totalItems > limit;

        const container = document.getElementById('changelog-container');
        const trigger = document.getElementById('loading-trigger');
        const spinner = document.getElementById('spinner');
        const noMore = document.getElementById('no-more');

        // Initial markdown rendering for first page
        document.querySelectorAll('.markdown-body').forEach(el => {
            if (el.dataset.rendered !== 'true') {
                el.innerHTML = DOMPurify.sanitize(marked.parse(el.textContent));
                el.dataset.rendered = 'true';
            }
        });

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            spinner.classList.remove('hidden');
            currentPage++;

            try {
                const response = await fetch(`/api/changelogs?page=${currentPage}&limit=${limit}`);
                const data = await response.json();
                
                if (data.logs.length === 0) {
                    hasMore = false;
                    noMore.classList.remove('hidden');
                } else {
                    data.logs.forEach(log => {
                        const card = document.createElement('div');
                        card.className = 'log-card p-6 rounded-xl';
                        
                        let html = '';
                        if (log.title) {
                            html += `<div class="text-teal-300 font-semibold text-sm mb-2">${log.title}</div>`;
                        }
                        const markdownHtml = DOMPurify.sanitize(marked.parse(log.content));
                        html += `<div class="markdown-body">${markdownHtml}</div>`;
                        
                        card.innerHTML = html;
                        container.appendChild(card);
                    });

                    if (currentPage * limit >= data.total) {
                        hasMore = false;
                        noMore.classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error('Error loading changelogs:', error);
            } finally {
                isLoading = false;
                spinner.classList.add('hidden');
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                loadMore();
            }
        }, { threshold: 0.1 });

        if (hasMore) {
            observer.observe(trigger);
        } else if (totalItems > 0) {
            noMore.classList.remove('hidden');
        }
    </script>
</body>
</html>
